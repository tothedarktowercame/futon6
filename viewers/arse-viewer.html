<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArSE Viewer — Synthetic QA Browser</title>

<style>
:root {
  --bg: #1a1a2e; --bg2: #16213e; --bg3: #0f3460;
  --fg: #e0e0e0; --fg2: #a0a0b0;
  --accent: #e94560; --gold: #d4a856; --green: #4ecca3;
  --blue: #7ec8e3; --purple: #b088f9; --orange: #f0a500;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
header { background: var(--bg2); border-bottom: 2px solid var(--accent); padding: 20px 0; margin-bottom: 30px; }
header .container { display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 1.6em; letter-spacing: 0.05em; }
header h1 span { color: var(--accent); }
header .stats { font-size: 0.9em; color: var(--fg2); }
#dashboard { }
.problem-group { margin-bottom: 30px; }
.problem-group h2 { font-size: 1.2em; color: var(--gold); border-bottom: 1px solid var(--bg3); padding-bottom: 8px; margin-bottom: 12px; }
.problem-group h2 .count { color: var(--fg2); font-size: 0.8em; font-weight: normal; }
.qa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.qa-card { background: var(--bg2); border: 1px solid var(--bg3); border-radius: 8px; padding: 14px; cursor: pointer; transition: border-color 0.2s, transform 0.1s; }
.qa-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.qa-card .card-title { font-size: 0.95em; font-weight: 600; margin-bottom: 8px; line-height: 1.3; }
.qa-card .card-meta { display: flex; gap: 12px; font-size: 0.78em; color: var(--fg2); margin-bottom: 8px; }
.qa-card .card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.qa-card .tag { background: var(--bg3); color: var(--blue); padding: 2px 8px; border-radius: 10px; font-size: 0.72em; }
.node-summary { display: flex; gap: 8px; }
.node-summary .ns { font-size: 0.72em; padding: 2px 6px; border-radius: 4px; }
.ns-term { background: rgba(212,168,86,0.2); color: var(--gold); }
.ns-expr { background: rgba(78,204,163,0.2); color: var(--green); }
.ns-scope { background: rgba(176,136,249,0.2); color: var(--purple); }
#detail { display: none; }
.back-btn { background: var(--bg3); color: var(--fg); border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9em; margin-bottom: 20px; }
.back-btn:hover { background: var(--accent); }
.detail-header { margin-bottom: 24px; }
.detail-header h2 { font-size: 1.3em; margin-bottom: 8px; }
.detail-header .detail-meta { color: var(--fg2); font-size: 0.85em; }
.qa-section { background: var(--bg2); border-radius: 8px; padding: 20px; margin-bottom: 16px; border-left: 3px solid var(--accent); }
.qa-section.answer { border-left-color: var(--green); }
.qa-section h3 { font-size: 0.9em; color: var(--fg2); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
.qa-section .content { font-size: 0.95em; line-height: 1.7; }
.qa-section .content p { margin-bottom: 12px; }
.graph-panel { background: var(--bg2); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
.graph-panel h3 { font-size: 0.9em; color: var(--fg2); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
.node-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.node-chip { padding: 4px 10px; border-radius: 6px; font-size: 0.82em; display: flex; align-items: center; gap: 4px; }
.node-chip .ntype { font-size: 0.7em; opacity: 0.7; }
.chip-term { background: rgba(212,168,86,0.15); color: var(--gold); border: 1px solid rgba(212,168,86,0.3); }
.chip-expression { background: rgba(78,204,163,0.15); color: var(--green); border: 1px solid rgba(78,204,163,0.3); }
.chip-scope { background: rgba(176,136,249,0.15); color: var(--purple); border: 1px solid rgba(176,136,249,0.3); }
.chip-post { background: rgba(233,69,96,0.15); color: var(--accent); border: 1px solid rgba(233,69,96,0.3); }
.edge-table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
.edge-table th { text-align: left; padding: 6px 10px; color: var(--fg2); border-bottom: 1px solid var(--bg3); }
.edge-table td { padding: 5px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.edge-type { padding: 2px 8px; border-radius: 4px; font-size: 0.85em; }
.et-mention { background: rgba(212,168,86,0.2); color: var(--gold); }
.et-surface { background: rgba(78,204,163,0.2); color: var(--green); }
.et-scope { background: rgba(176,136,249,0.2); color: var(--purple); }
.et-discourse { background: rgba(233,69,96,0.2); color: var(--accent); }
.et-iatc { background: rgba(240,165,0,0.2); color: var(--orange); }
.expr-panel { background: var(--bg2); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
.expr-panel h3 { font-size: 0.9em; color: var(--fg2); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
.expr-item { background: var(--bg); padding: 10px 14px; border-radius: 6px; margin-bottom: 8px; border-left: 2px solid var(--green); font-size: 1.1em; overflow-x: auto; }
.totals-bar { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; }
.total-card { background: var(--bg2); padding: 16px 24px; border-radius: 8px; text-align: center; flex: 1; min-width: 120px; }
.total-card .num { font-size: 2em; font-weight: 700; color: var(--accent); }
.total-card .label { font-size: 0.8em; color: var(--fg2); margin-top: 4px; }
</style>
</head>

  <div id="dashboard">

  <div id="detail">
    <button class="back-btn" onclick="showDashboard()">&larr; Back to index</button>
    <div id="detail-content"></div>
  </div>
</div>

le t<1 the ratio is finite and positive. Consequently the stationary law\\n\\n\\qquad \\pi(\\mu)=\\frac{F_{\\mu}^*(x;1,t)}{P_{\\lambda}^*(x;1,t)}=\\frac{F_{\\mu}(x;1,t)}{\\displaystyle \\sum_{\\nu\\in S_n(\\lambda)} F_{\\nu}(x;1,t) \\prod_{i\\ge 1}(t;t)_{m_i(\\nu)}^{-1}}\\prod_{i\\ge 1}(t;t)_{m_i(\\mu)}^{-1}\\n\\nis just the unstarred weight multiplied by the local product coming from plethystic substitution. The local-to-global compatibility follows because the CTMC transition rates are expressed in terms of ratios F_{\\mu}^*/F_{\\nu}^*, and the common factors (t;t)_{m_i} cancel except for the multiplicities that actually change, matching the combinatorial updates of the clock process. Thus the star vs non-star bridge is completely explicit: the starred law agrees with the unstarred one after dividing by the hook-content-type product, so the global sector sum remains a true probability normalization.", "tags": ["combinatorics", "probability", "symmetric-functions"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "symmetric-functions", "label": "modified Macdonald polynomial"}, {"id": "t2", "type": "term", "subtype": "symmetric-functions", "label": "star normalization"}, {"id": "t3", "type": "term", "subtype": "probability", "label": "finite-state CTMC"}, {"id": "t4", "type": "term", "subtype": "probability", "label": "stationary distribution"}, {"id": "t5", "type": "term", "subtype": "symmetric-functions", "label": "sector sum P_\\lambda^*"}, {"id": "t6", "type": "term", "subtype": "symmetric-functions", "label": "plethystic evaluation"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "\\pi(\\mu)=\\frac{F_{\\mu}^*(x;1,t)}{P_{\\lambda}^*(x;1,t)}"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "F_{\\mu}^*(x;1,t)=\\frac{F_{\\mu}(x;1,t)}{\\prod_{i\\ge 1}(t;t)_{m_i(\\mu)}}"}, {"id": "e3", "type": "expression", "subtype": "latex", +\\mathrm{leg}(s)}) and to normalize globally by P_{\\lambda}^*(x;1,t)=\\sum_{\\nu\\in S_n(\\lambda)}F_{\\nu}^*(x;1,t)? In other words, how do we prove that the star/non-star conversion is purely multiplicative and therefore compatible with the local clock probabilities in the CTMC construction?", "answer": "Macdonald's plethystic definition gives F_{\\mu}^*(X;q,t)=b_{\\mu}(q,t)F_{\\mu}[X/(1-t);q,t], so at q=1 the only difference between the starred and unstarred specialisations is the scalar\\n\\n\\qquad b_{\\mu}(1,t)=\\prod_{s\\in\\mu}(1-t^{1+\\mathrm{leg}(s)})=\\prod_{i\\ge 1}(t;t)_{m_i(\\mu)},\\n\\nwhere the final equality uses that the legs count repeated parts. Because this factor depends solely on the multiplicities m_i(\\mu), every local transition that changes the content by moving one particle multiplies b_{\\mu}(1,t) by exactly the same truncated geometric factor that appears in the update rule. Thus the detailed-balance ratio\\n\\n\\qquad \\frac{\\pi(\\mu)}{\\pi(\\nu)}=\\frac{F_{\\mu}(x;1,t)}{F_{\\nu}(x;1,t)}\\cdot\\frac{b_{\\nu}(1,t)}{b_{\\mu}(1,t)}\\n\\nmatches the ratio imposed by the local clocks, showing that the CTMC is consistent with the starred stationary law. Summing over the sector gives\\n\\n\\qquad P_{\\lambda}^*(x;1,t)=\\sum_{\\nu\\in S_n(\\lambda)}F_{\\nu}(x;1,t)\\,b_{\\nu}(1,t)^{-1},\\n\\nso the normalization remains a strict positive constant because the sum of Macdonald polynomials over the finite sector is finite. Hence the star/non-star bridge is purely multiplicative: F_{\\mu}^*=F_{\\mu}/b_{\\mu}(1,t), P_{\\lambda}^*=\\sum F_{\\nu}/b_{\\nu}(1,t), and the CTMC local probabilities automatically glue to the global stationary distribution.", "tags": ["combinatorics", "probability", "symmetric-functions"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "symmetric-functions", "label": "modified Macdonald polynomial"}, {"id": "t2", "type": "term", "subtype": "symmetric-functions", "label": "star normalization"}, {"id": "t3", "type": "term", "subtype": "probability", "label": "finite-state CTMC"}, {"id": "t4", "type": "term", "subtype": "probability", "label": "stationary law"}, {"id": "t5", "type": "term", "subtype": "symmetric-functions", "label": "sector sum P_\\lambda^*"}, {"id": "t6", "type": "term", "subtype": "symmetric-functions", "label": "Macdonald hook factor b_\\mu(1,t)"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "\\pi(\\mu)=\\frac{F_{\\mu}^*(x;1,t)}{P_{\\lambda}^*(x;1,t)}"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "b_{\\mu}(1,t)=\\prod_{s\\in\\mu}(1-t^{1+\\operatorname{leg}(s)})"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "P_{\\lambda}^*(x;1,t)=\\sum_{\\nu\\in S_n(\\lambda)}F_{\\nu}^*(x;1,t)"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for all x_i>0 and 0\\le t<1"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if a transition changes m_i(\\mu) then the factor b_{\\mu}(1,t) updates by the same truncated geometric weight"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["q1", "t4"]}, {"type": "mention", "ends": ["q1", "t5"]}, {"type": "mention", "ends": ["q1", "t6"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["q1", "e1"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p3-s1-000", "title": "Why is the t-PushTASEP update truncated geometric?", "question": "Consider the inhomogeneous multispecies t-PushTASEP on an n-site ring with rates 1/x_j as described in the proof of node p3-s1. When site j rings and the active species r sits above m weaker species clockwise, the construction selects the k-th weaker species with probability t^{k-1}/[m]_t, where [m]_t=1+t+\\cdots+t^{m-1}, and then runs the push-cascade until species 0 is displaced. How does this truncated geometric law follow from the Macdonald Pieri rule for adding a box to F_{\\mu}(x;1,t), and why does it guarantee that the local update is compatible with the CTMC generator built from the modified Macdonald stationary weights?", "answer": "Fix a configuration \\eta with active species r at site j and order the weaker species clockwise as (s_1,\\dots,s_m). Applying the one-row Macdonald Pieri rule with q=1 gives\\n\\n\\qquad F_{\\eta^{(k)}}(x;1,t)=t^{k-1}\\frac{1-t^{m-k+1}}{1-t^{m}}F_{\\eta}(x;1,t),\\n\\nwhere \\eta^{(k)} is obtained by swapping r with s_k and leaving the rest unchanged. The factor t^{k-1} accounts for the q=1 Macdonald charge gained by crossing k-1 weaker species, while the denominator 1-t^{m} is the hook-length normalisation coming from the m choices available. Consequently\\n\\n\\qquad \\frac{F_{\\eta^{(k)}}(x;1,t)}{F_{\\eta}(x;1,t)}=t^{k-1}\\frac{1-t}{1-t^{m}},\\n\\nso multiplying by (1-t^{m})/(1-t) yields exactly the probability mass t^{k-1}/[m]_t assigned to the event that r jumps past s_k. The sum \\sum_{k=1}^m t^{k-1} equals [m]_t, hence the truncated geometric law is normalized. Because the CTMC generator uses ratios of stationary weights, the product\\n\\n\\qquad \\frac{\\pi(\\eta^{(k)})}{\\pi(\\eta)}=\\frac{F_{\\eta^{(k)}}^*(x;1,t)}{F_{\\eta}^*(x;1,t)}=t^{k-1}\\frac{1-t}{1-t^{m}}\\n\\nmatches the prescribed local probability, so the push-cascade update obeys detailed balance with the modified Macdonald stationary distribution. This derivation shows that the truncated geometric choice is not ad hoc: it is forced by the Pieri coefficients, and therefore the local rule and global stationary measure are perfectly compatible.", "tags": ["combinatorics", "probability", "markov-chains"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "probability", "label": "multispecies t-PushTASEP"}, {"id": "t2", "type": "term", "subtype": "probability", "label": "truncated geometric distribution"}, {"id": "t3", "type": "term", "subtype": "symmetric-functions", "label": "Macdonald Pieri rule"}, {"id": "t4", "type": "term", "subtype": "probability", "label": "push-cascade update"}, {"id": "t5", "type": "term", "subtype": "probability", "label": "CTMC generator"}, {"id": "t6", "type": "term", "subtype": "symmetric-functions", "label": "modified Macdonald stationary law"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "\\mathbf{P}(k)=\\frac{t^{k-1}}{[m]_t},\\quad [m]_t=1+t+\\cdots+t^{m-1}"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "F_{\\eta^{(k)}}(x;1,t)=t^{k-1}\\frac{1-t^{m-k+1}}{1-t^{m}}F_{\\eta}(x;1,t)"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "\\frac{\\pi(\\eta^{(k)})}{\\pi(\\eta)}=t^{k-1}\\frac{1-t}{1-t^{m}}"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for any ring configuration with m weaker species"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if 0\\le t<1 then [m]_t>0 and the probabilities normalize"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["q1", "t4"]}, {"type": "mention", "ends": ["q1", "t5"]}, {"type": "mention", "ends": ["q1", "t6"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["q1", "e1"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p3-s1-001", "title": "Deriving the t-PushTASEP clock from the q=1 Pieri rule", "question": "In the same multispecies t-PushTASEP setup, suppose a site rings and species r must decide which of the m weaker species clockwise will absorb it before the push cascade. Sources often claim that the selection law is the truncated geometric mass t^{k-1}/[m]_t, derived from the Macdonald raising operators, but the intermediate Pieri computation is usually omitted. Could someone show explicitly how the q=1 Pieri coefficients compare F_{\\mu}(x;1,t) and F_{\\mu^{(k)}}(x;1,t), and why their ratio forces the local probabilities to be t^{k-1}/[m]_t so that the global modified Macdonald stationary law remains invariant?", "answer": "Let \\mu denote the current configuration and let \\mu^{(k)} be the state produced when r skips the first k-1 weaker species. Adding a box in column k of the recording tableau corresponds to applying the q=1 Pieri operator E_1[X]=\\sum_i x_i to F_{\\mu}. The explicit coefficient (Macdonald, Chap. VI, (6.24)) is\\n\\n\\qquad F_{\\mu^{(k)}}(x;1,t)=\\frac{1-t^{m-k+1}}{1-t^{m}}\\,t^{k-1}\\,F_{\\mu}(x;1,t).\\n\\nAfter cancelling the common hook terms in the stationary ratios we obtain\\n\\n\\qquad \\frac{\\pi(\\mu^{(k)})}{\\pi(\\mu)}=t^{k-1}\\frac{1-t}{1-t^{m}},\\n\\nso if we renormalize by the factor (1-t^{m})/(1-t)=\\sum_{k=1}^m t^{k-1} we recover the truncated geometric law. Because every push cascade factors into successive Pieri moves, the same ratio holds for each intermediate state, showing that detailed balance with the modified Macdonald measure is satisfied and the CTMC generator preserves probability.", "tags": ["combinatorics", "probability", "markov-chains"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "probability", "label": "multispecies t-PushTASEP"}, {"id": "t2", "type": "term", "subtype": "probability", "label": "truncated geometric weight"}, {"id": "t3", "type": "term", "subtype": "symmetric-functions", "label": "Pieri coefficient"}, {"id": "t4", "type": "term", "subtype": "probability", "label": "push cascade"}, {"id": "t5", "type": "term", "subtype": "probability", "label": "detailed balance"}, {"id": "t6", "type": "term", "subtype": "symmetric-functions", "label": "modified Macdonald measure"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "\\mathbf{P}(k)=\\frac{t^{k-1}}{[m]_t}"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "F_{\\mu^{(k)}}(x;1,t)=\\frac{1-t^{m-k+1}}{1-t^{m}}\\,t^{k-1}F_{\\mu}(x;1,t)"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "\\frac{\\pi(\\mu^{(k)})}{\\pi(\\mu)}=t^{k-1}\\frac{1-t}{1-t^{m}}"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for any site with m weaker species"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if 0\\le t<1 then [m]_t=\\sum_{k=1}^m t^{k-1}"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["q1", "t4"]}, {"type": "mention", "ends": ["q1", "t5"]}, {"type": "mention", "ends": ["q1", "t6"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["q1", "e1"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p3-s4-000", "title": "Why is the q=1 AMW ring chain irreducible with positive normalization?", "question": "The AMW q=1 theorem asserts that on the ring sector S_n(\\lambda) with x_i>0 and 0\\le t<1 the inhomogeneous multispecies exclusion chain has stationary law \\pi(\\eta)=F_{\\eta}(x;1,t)/P_{\\lambda}(x;1,t), where P_{\\lambda}(x;1,t)=\\sum_{\\nu\\in S_n(\\lambda)}F_{\\nu}(x;1,t). However, the proof sketch in node p3-s4 assumes the process is irreducible on that sector and that the normalization sum is strictly positive without giving details. How can we check irreducibility of the q=1 ring chain and verify that the sector sum P_{\\lambda}(x;1,t) is finite and positive, thereby justifying the use of the AMW stationary distribution?", "answer": "The state space S_n(\\lambda) consists of permutations of the multiset with content \\lambda. Every generator of the ring process swaps two adjacent species whenever the active clock rings and the weaker particle lies ahead, so any elementary transposition that respects the content occurs at positive rate. Because adjacent transpositions generate the symmetric group, every configuration can be reached from any other through a sequence of such swaps, proving irreducibility on the fixed-content sector.\\n\\nFor positivity, recall that the modified Macdonald polynomials are symmetric power series with nonnegative coefficients when x_i>0 and 0\\le t<1; in particular F_{\\eta}(x;1,t)>0 for every configuration \\eta. The sector sum\\n\\n\\qquad P_{\\lambda}(x;1,t)=\\sum_{\\nu\\in S_n(\\lambda)}F_{\\nu}(x;1,t)\\n\\nis finite because the sector contains only |S_n(\\lambda)| states, and it is strictly positive because each summand is positive. Consequently the stationary weights \\pi(\\eta)=F_{\\eta}(x;1,t)/P_{\\lambda}(x;1,t) form a bona fide probability measure, and the irreducibility argument implies that this measure is the unique stationary distribution described by the AMW theorem.", "tags": ["probability", "markov-chains", "combinatorics"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "probability", "label": "AMW theorem"}, {"id": "t2", "type": "term", "subtype": "probability", "label": "fixed-content sector"}, {"id": "t3", "type": "term", "subtype": "probability", "label": "multispecies exclusion chain"}, {"id": "t4", "type": "term", "subtype": "probability", "label": "irreducibility"}, {"id": "t5", "type": "term", "subtype": "probability", "label": "stationary distribution"}, {"id": "t6", "type": "term", "subtype": "symmetric-functions", "label": "modified Macdonald polynomial"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "\\pi(\\eta)=\\frac{F_{\\eta}(x;1,t)}{P_{\\lambda}(x;1,t)}"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "P_{\\lambda}(x;1,t)=\\sum_{\\nu\\in S_n(\\lambda)}F_{\\nu}(x;1,t)"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "F_{\\eta}(x;1,t)>0 \text{ for } x_i>0, 0\\le t<1"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for x_i>0 and 0\\le t<1"}, {"id": "s2", "type": "scope", "subtype": "quant/universal", "text": "for every configuration in S_n(\\lambda)"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["q1", "t4"]}, {"type": "mention", "ends": ["q1", "t5"]}, {"type": "mention", "ends": ["q1", "t6"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["q1", "e1"]}, {"type": "surface", "ends": ["q1", "e2"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p3-s4-001", "title": "Checking AMW irreducibility and normalization on the q=1 ring", "question": "Working again in the q=1 ring sector S_n(\\lambda) with rates 1/x_j and 0\\le t<1, the AMW result declares that the stationary measure of the multispecies exclusion chain is \\pi(\\eta)=F_{\\eta}(x;1,t)/P_{\\lambda}(x;1,t). To invoke this result we must know that (i) the CTMC is irreducible on S_n(\\lambda) and (ii) the normalization constant P_{\\lambda}(x;1,t)=\\sum_{\\nu\\in S_n(\\lambda)}F_{\\nu}(x;1,t) is finite and strictly positive. Can someone provide a concrete argument for each point using only the t-PushTASEP update rules and basic properties of modified Macdonald polynomials?", "answer": "(i) Irreducibility follows from the push-cascade mechanics. Given any two configurations \\eta and \\xi, order the particles in \\eta lexicographically by species label. Each clock event either swaps an adjacent pair or performs a push that is equivalent to a sequence of adjacent swaps. Because the allowed transitions include every adjacent swap of unequal species with positive rate, we can bubble sort \\eta into the canonical sorted word and then reverse the sequence to reach \\xi. Hence the graph of states connected by positive-rate updates is the Cayley graph of the multiset permutations, so the chain is irreducible.\\n\\n(ii) Positivity of the sector sum is immediate from Macdonald theory. At q=1 the modified Macdonald polynomial F_{\\nu}(x;1,t) has a nonnegative monomial expansion when x_i>0 and 0\\le t<1 (Macdonald, Chap. VI). Therefore each term in\\n\\n\\qquad P_{\\lambda}(x;1,t)=\\sum_{\\nu\\in S_n(\\lambda)}F_{\\nu}(x;1,t)\\n\\nis strictly positive, and there are only |S_n(\\lambda)| terms, so the sum is finite and positive. These two facts justify the hypotheses of the AMW theorem and ensure that \\pi(\\eta)=F_{\\eta}(x;1,t)/P_{\\lambda}(x;1,t) is a well-defined stationary distribution for the ring chain.", "tags": ["probability", "markov-chains", "combinatorics"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "probability", "label": "AMW stationary law"}, {"id": "t2", "type": "term", "subtype": "probability", "label": "fixed-content sector"}, {"id": "t3", "type": "term", "subtype": "probability", "label": "t-PushTASEP update"}, {"id": "t4", "type": "term", "subtype": "probability", "label": "irreducibility"}, {"id": "t5", "type": "term", "subtype": "symmetric-functions", "label": "modified Macdonald positivity"}, {"id": "t6", "type": "term", "subtype": "probability", "label": "sector normalization"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "\\pi(\\eta)=\\frac{F_{\\eta}(x;1,t)}{P_{\\lambda}(x;1,t)}"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "P_{\\lambda}(x;1,t)=\\sum_{\\nu\\in S_n(\\lambda)}F_{\\nu}(x;1,t)"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "F_{\\nu}(x;1,t)>0 \text{ whenever } x_i>0, 0\\le t<1"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for x_i>0 and 0\\le t<1"}, {"id": "s2", "type": "scope", "subtype": "quant/universal", "text": "for all states in S_n(\\lambda)"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["q1", "t4"]}, {"type": "mention", "ends": ["q1", "t5"]}, {"type": "mention", "ends": ["q1", "t6"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["q1", "e1"]}, {"type": "surface", "ends": ["q1", "e2"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p3-s6-000", "title": "Why are the modified Macdonald stationary weights positive?", "question": "In node p3-s6 we require the stationary weights \\pi(\\mu)=F_{\\mu}(x;1,t)/P_{\\lambda}(x;1,t) to be strictly positive for x_i>0 and 0\\le t<1. The proof outline cites Macdonald positivity but does not spell out how it applies to the modified polynomials and the finite sector sum. Could someone explain why both F_{\\mu}(x;1,t) and P_{\\lambda}(x;1,t)=\\sum_{\\nu\\in S_n(\\lambda)}F_{\\nu}(x;1,t) are positive real numbers in that parameter range, ensuring that the stationary distribution is well-defined?", "answer": "At q=1 the modified Macdonald polynomial admits the Haglund-Haiman-Loehr lattice-path expansion\\n\\n\\qquad F_{\\mu}(x;1,t)=\\sum_{T\\in\\operatorname{SSYT}(\\mu)} x^{\\mathrm{wt}(T)} t^{\\mathrm{maj}(T)},\\n\\nwhere the sum runs over semistandard Young tableaux of shape \\mu, the monomial x^{\\mathrm{wt}(T)} uses the positive variables x_i, and the major index statistic \\mathrm{maj}(T) is nonnegative. For x_i>0 and 0\\le t<1 every term of the sum is positive, hence F_{\\mu}(x;1,t)>0.\\n\\nThe normalization constant is a finite sum over the sector S_n(\\lambda):\\n\\n\\qquad P_{\\lambda}(x;1,t)=\\sum_{\\nu\\in S_n(\\lambda)}F_{\\nu}(x;1,t).\\n\\nEach summand is strictly positive by the same argument, and there are only |S_n(\\lambda)| summands because the sector is a finite content class. Therefore P_{\\lambda}(x;1,t)>0, so the ratio \\pi(\\mu)=F_{\\mu}(x;1,t)/P_{\\lambda}(x;1,t) defines a legitimate probability weight for every \\mu\\in S_n(\\lambda).", "tags": ["combinatorics", "symmetric-functions", "probability"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "symmetric-functions", "label": "modified Macdonald polynomial"}, {"id": "t2", "type": "term", "subtype": "combinatorics", "label": "HHL formula"}, {"id": "t3", "type": "term", "subtype": "probability", "label": "stationary weight"}, {"id": "t4", "type": "term", "subtype": "probability", "label": "sector normalization"}, {"id": "t5", "type": "term", "subtype": "combinatorics", "label": "semistandard tableau"}, {"id": "t6", "type": "term", "subtype": "combinatorics", "label": "major index"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "F_{\\mu}(x;1,t)=\\sum_{T\\in\\operatorname{S ould like a precise justification that treats both numerator and denominator. How do the Haglund-Haiman-Loehr tableaux formula and the finite nature of the sector sum imply that F_{\\mu}^*(x;1,t)>0 and P_{\\lambda}^*(x;1,t)>0, so that the CTMC stationary law is well defined?", "answer": "By definition F_{\\mu}^*(X;q,t)=b_{\\mu}(q,t)F_{\\mu}[X/(1-t);q,t]. At q=1 the plethystic substitution amounts to replacing each variable with the positive series x_i(1+t+t^2+\\cdots), so every monomial coefficient in the Schur-positive expansion becomes a sum of nonnegative terms. The HHL formula then reads\\n\\n\\qquad F_{\\mu}^*(x;1,t)=\\sum_{T\\in\\operatorname{SSYT}(\\mu)} b_{\\mu}(1,t)^{-1} x^{\\mathrm{wt}(T)} t^{\\mathrm{maj}(T)},\\n\\nand since x_i>0 and 0\\le t<1, every term of the sum is positive, proving F_{\\mu}^*(x;1,t)>0.\\n\\nThe normalization constant over the finite sector is\\n\\n\\qquad P_{\\lambda}^*(x;1,t)=\\sum_{\\nu\\in S_n(\\lambda)}F_{\\nu}^*(x;1,t).\\n\\nEach summand is positive by the argument above, and the sum is finite because the sector contains finitely many configurations. Therefore P_{\\lambda}^*(x;1,t)>0, so the stationary probabilities \\pi(\\mu)=F_{\\mu}^*(x;1,t)/P_{\\lambda}^*(x;1,t) are well defined and strictly positive for every \\mu\\in S_n(\\lambda).", "tags": ["combinatorics", "symmetric-functions", "probability"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "symmetric-functions", "label": "modified Macdonald polynomial"}, {"id": "t2", "type": "term", "subtype": "symmetric-functions", "label": "HHL tableaux formula"}, {"id": "t3", "type": "term", "subtype": "probability", "label": "stationary law"}, {"id": "t4", "type": "term", "subtype": "probability", "label": "sector normalization"}, {"id": "t5", "type": "term", "subtype": "combinatorics", "label": "semistandard tableau"}, {"id": "t6", "type": "term", "subtype": "combinatorics",  G be a cocompact lattice containing a nontrivial element g of order 2. Could such a \\Gamma be realized as \\pi_1(M) for a closed manifold M whose universal cover \\widetilde M is rationally acyclic (i.e. H_i(\\widetilde M;\\mathbb Q)=0 for i>0)? I know that torsion-free compact lattices give closed aspherical manifolds G/K/\\Gamma, but I am unsure whether the presence of 2-torsion merely produces orbifold singularities or whether it outright obstructs any manifold model with rationally acyclic cover.", "answer": "No. If M is a closed manifold and \\widetilde M is its universal cover, then the deck transformation group is isomorphic to \\pi_1(M) and acts freely and properly discontinuously on \\widetilde M. Freeness forces every nontrivial element of \\Gamma to move every point of \\widetilde M, so \\Gamma must be torsion-free; an element g of order 2 would fix some point of \\widetilde M by the Lefschetz fixed-point theorem (because the Lefschetz number of an orientation-preserving involution on a rationally acyclic compact manifold is 1), contradicting freeness.\\n\\nTherefore a uniform lattice with 2-torsion cannot arise as the fundamental group of any closed manifold whose universal cover is rationally acyclic. The best one can obtain from such a lattice is a compact orbifold \\Gamma\\backslash X, where X=G/K is the symmetric space. To produce a genuine manifold, one must pass to a torsion-free finite-index subgroup of \\Gamma; Selberg's lemma guarantees the existence of such a subgroup, and its quotient yields the desired manifold while the original lattice only gives the orbifold.", "tags": ["lie-groups", "lattice", "algebraic-topology", "manifolds"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "lie-groups", "label": "uniform lattice"}, {"id": "t2", "type": "term", "subtype": "lie-groups", "label": "semisimple Lie group"}, {"id": "t3", "type": "term", "subtype": "algebraic-topology", "label": "rationally acyclic universal cover"}, {"id": "t4", "type": "term", "subtype": "algebraic-topology", "label": "deck transformation group"}, {"id": "t5", "type": "term", "subtype": "geometry", "label": "orbifold quotient"}, {"id": "t6", "type": "term", "subtype": "algebraic-topology", "label": "Selberg lemma"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "H_i(\\widetilde M;\\mathbb Q)=0 \text{ for } i>0"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "L(g)=\\sum_i (-1)^i \\operatorname{tr}(g_*:H_i(\\widetilde M;\\mathbb Q)\\to H_i(\\widetilde M;\\mathbb Q)) =1"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "X/\\Gamma \text{ is an orbifold when } \\Gamma \text{ has torsion}"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for every closed manifold M with universal cover \\widetilde M"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if \\Gamma contains torsion then its action cannot be free"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["q1", "e1"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p7-problem-001", "title": "Does torsion in a uniform lattice obstruct rationally acyclic manifolds?", "question": "Let G be a connected semisimple Lie group with finite center and let \\Gamma<G be a cocompact lattice that contains a nontrivial element of order 2. If one wants a closed manifold M with rationally acyclic universal cover whose fundamental group is \\Gamma, is the presence of this torsion an actual obstruction, or can one keep the torsion and still obtain M by performing equivariant surgeries on the orbifold X/\\Gamma where X=G/K is the symmetric space?", "answer": "Torsion is a hard obstruction. If M is a closed manifold whose universal cover is rationally acyclic, then \\Gamma=\\pi_1(M) acts freely on the universal cover \\widetilde M. Every deck transformation is homotopic to the identity, so for any torsion element g\\in\\Gamma the Lefschetz number satisfies L(g)=1. Lefschetz fixed-point theory therefore implies that g has a fixed point in \\widetilde M, contradicting freeness. Hence \\Gamma must be torsion-free.\\n\\nEquivariant surgery on the orbifold X/\\Gamma cannot remove the fixed points without first passing to a torsion-free subgroup. Selberg's lemma provides a finite-index torsion-free subgroup \\Gamma'\\subset\\Gamma, and the quotient X/\\Gamma' is the desired aspherical manifold with rationally acyclic cover X. The original lattice merely produces the orbifold X/\\Gamma; any attempt to descend back to \\Gamma reintroduces isotropy and destroys the manifold structure.", "tags": ["lie-groups", "lattice", "algebraic-topology", "manifolds"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "lie-groups", "label": "uniform lattice"}, {"id": "t2", "type": "term", "subtype": "lie-groups", "label": "semisimple Lie group"}, {"id": "t3", "type": "term", "subtype": "algebraic-topology", "label": "rationally acyclic universal cover"}, {"id": "t4", "type": "term", "subtype": "algebraic-topology", "label": "Lefschetz fixed-point theorem"}, {"id": "t5", "type": "term", "subtype": "geometry", "label": "orbifold quotient"}, {"id": "t6", "type": "term", "subtype": "lie-groups", "label": "Selberg lemma"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "L(g)=\\sum_i (-1)^i \\operatorname{tr}(g_*:H_i(\\widetilde M;\\mathbb Q)\\to H_i(\\widetilde M;\\mathbb Q))=1"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "X=G/K,\\quad M=X/\\Gamma' \text{ when } \\Gamma' \text{ is torsion-free}"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for any closed manifold with rationally acyclic universal cover"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if \\Gamma has torsion then its action on \\widetilde M cannot be free"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p7-s1-000", "title": "Why X/\u0393 is an orbifold when \u0393 has torsion", "question": "Let X=G/K be the contractible symmetric space of a connected semisimple Lie group with finite center and let \\Gamma< G be a uniform lattice that contains an involution. Why does the quotient X/\\Gamma fail to be a manifold, and how can one describe the local orbifold chart near the image of a fixed point of that involution?", "answer": "If \\Gamma is torsion-free then its action on X is free and properly discontinuous, so the quotient X/\\Gamma is a manifold and in fact aspherical. When \\Gamma contains torsion, pick x\\in X fixed by an element \\gamma\\in\\Gamma of finite order. The stabilizer \\Gamma_x is finite (because G acts properly on X), and the linear isotropy representation identifies \\Gamma_x with a finite subgroup of O(T_xX). Thus the action fails to be free precisely on the fixed-point set X^{\\gamma}, and the quotient is modelled on the linear slice T_xX/\\Gamma_x rather than T_xX.\\n\\nThe slice theorem provides a \\Gamma_x-invariant neighborhood U of x such that the \\Gamma-saturation \\Gamma\\cdot U projects homeomorphically onto (U/\\Gamma_x)\\subset X/\\Gamma. Because \\Gamma_x is finite, U/\\Gamma_x is a classical orbifold chart. Therefore X/\\Gamma is an orbifold whose singular locus corresponds to the images of fixed-point sets of torsion elements, and only after passing to a torsion-free finite-index subgroup does one recover a genuine manifold quotient.", "tags": ["lie-groups", "orbifolds", "differential-topology"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "lie-groups", "label": "symmetric space"}, {"id": "t2", "type": "term", "subtype": "lie-groups", "label": "uniform lattice"}, {"id": "t3", "type": "term", "subtype": "geometry", "label": "orbifold chart"}, {"id": "t4", "type": "term", "subtype": "geometry", "label": "fixed-point set"}, {"id": "t5", "type": "term", "subtype": "geometry", "label": "slice theorem"}, {"id": "t6", "type": "term", "subtype": "geometry", "label": "aspherical manifold"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "\\Gamma_x=\\operatorname{Stab}_\\Gamma(x)"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "U/\\Gamma_x \text{ is a neighborhood of } [x]\\in X/\\Gamma"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "X^{\\gamma}=\\{y\\in X: \\gamma y=y\\}"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for any torsion element \\gamma\\in\\Gamma"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if \\Gamma is torsion-free then X/\\Gamma is a manifold"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t4"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["q1", "e1"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p7-s1-001", "title": "Fixed-point strata of torsion lattices on symmetric spaces", "question": "Suppose \\Gamma< G is a uniform lattice in a semisimple Lie group whose action on X=G/K contains an involution g. How can we describe the fixed-point set X^g and the resulting singular stratum of the orbifold X/\\Gamma, and why does passing to a torsion-free finite-index subgroup remove these singularities?", "answer": "Cartan's fixed-point theorem shows that an isometry of finite order on the nonpositively curved symmetric space X fixes a totally geodesic submanifold X^g. Because the stabilizer \\Gamma_x of any x\\in X^g is finite, the local model of X^g near x is just the fixed-point subspace of the isotropy representation of \\Gamma_x on T_xX. The normal directions transform by a nontrivial representation of \\Gamma_x, so the quotient looks like (T_xX^{g} \\oplus N_x)/\\Gamma_x, i.e. an orbifold chart with a mirror (if g acts as a reflection) or higher-order cone.\\n\\nSelberg's lemma provides a torsion-free subgroup \\Gamma'\\subset \\Gamma of finite index. Because torsion elements are exactly those creating nontrivial stabilizers, the action of \\Gamma' on X is free, so X/\\Gamma' is a genuine manifold and the covering map X/\\Gamma' \\to X/\\Gamma ramifies precisely over the singular strata determined by the various X^g. Thus the singularities in X/\\Gamma disappear after removing torsion, confirming that orbifold issues are solely caused by the finite stabilizers coming from torsion elements.", "tags": ["lie-groups", "orbifolds", "differential-topology"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "lie-groups", "label": "symmetric space"}, {"id": "t2", "type": "term", "subtype": "lie-groups", "label": "uniform lattice"}, {"id": "t3", "type": "term", "subtype": "geometry", "label": "fixed-point set"}, {"id": "t4", "type": "term", "subtype": "geometry", "label": "orbifold stratum"}, {"id": "t5", "type": "term", "subtype": "geometry", "label": "Cartan fixed-point theorem"}, {"id": "t6", "type": "term", "subtype": "lie-groups", "label": "Selberg lemma"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "X^{g}=\\{x\\in X: gx=x\\}"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "\\Gamma_x=\\operatorname{Stab}_\\Gamma(x) \text{ is finite}"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "(T_xX^{g} \\oplus N_x)/\\Gamma_x \text{ is an orbifold chart}"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for every torsion element g\\in\\Gamma"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if \\Gamma'\\subset\\Gamma is torsion-free then X/\\Gamma' is a manifold"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["q1", "e1"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p7-s2-000", "title": "How does Bredon cohomology give rational Poincar\u00e9 duality for torsion lattices?", "question": "Let X=G/K be the symmetric space of a connected semisimple Lie group with finite center and let \\Gamma< G be a uniform lattice that may have torsion. Ordinary group cohomology with compact supports gives Poincar\u00e9 duality for torsion-free lattices, but what should replace it when \\Gamma has finite stabilizers? More concretely, how do the Bredon/orbifold cohomology groups \\widehat H^*_c(X/\\Gamma;\\mathbb Q) furnish a rational Poincar\u00e9 duality pairing of formal dimension d=\\dim X for \\Gamma?", "answer": "Because the \\Gamma-action on X is proper and cocompact, each isotropy group \\Gamma_x is finite. One therefore forms the Bredon cohomology of \\Gamma with coefficients in the rational Mackey functor given by the trivial representation:\\n\\n\\qquad H^*_{\\mathcal F}(\\Gamma;\\mathbb Q)=H^*(\\operatorname{Hom}_{\\mathcal O\\Gamma}(C_*^{\\mathcal F}(X),\\underline{\\mathbb Q})).\\n\\nThe equivariant Eckmann\u2013Shapiro spectral sequence collapses to give\\n\\n\\qquad H^*_{\\mathcal F}(\\Gamma;\\mathbb Q)\\cong H^*_c(X;\\mathbb Q),\\n\\nbecause every fixed-point set X^{H} of a finite subgroup H\\subset\\Gamma is contractible and carries the same compactly supported cohomology as X. Poincar\u00e9 duality holds for the orientable manifold X of dimension d, so cap product with the fundamental class \\[X]\\in H_d^c(X;\\mathbb Q) furnishes isomorphisms\\n\\n\\qquad H^i_{\\mathcal F}(\\Gamma;\\mathbb Q)\\cong H_{d-i}^{\\mathcal F}(\\Gamma;\\mathbb Q).\\n\\nThis is the rational orbifold Poincar\u00e9 duality satisfied by the orbifold X/\\Gamma. When \\Gamma is torsion-free the Bredon groups reduce to ordinary cohomology, recovering classical duality. Thus the Bredon/orbifold description supplies the desired rational PD structure of formal dimension d even in the presence of torsion.", "tags": ["group-cohomology", "homological-algebra", "algebraic-topology"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "group-theory", "label": "uniform lattice"}, {"id": "t2", "type": "term", "subtype": "algebraic-topology", "label": "Bredon cohomology"}, {"id": "t3", "type": "term", "subtype": "algebraic-topology", "label": "orbifold cohomology"}, {"id": "t4", "type": "term", "subtype": "algebraic-topology", "label": "compactly supported cohomology"}, {"id": "t5", "type": "term", "subtype": "algebraic-topology", "label": "Poincar\u00e9 duality"}, {"id": "t6", "type": "term", "subtype": "group-theory", "label": "finite isotropy"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "H^*_{\\mathcal F}(\\Gamma;\\mathbb Q)=\\operatorname{Hom}_{\\mathcal O\\Gamma}(C_*^{\\mathcal F}(X),\\underline{\\mathbb Q})"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "H^*_{\\mathcal F}(\\Gamma;\\mathbb Q)\\cong H^*_c(X;\\mathbb Q)"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "H^i_{\\mathcal F}(\\Gamma;\\mathbb Q)\\cong H_{d-i}^{\\mathcal F}(\\Gamma;\\mathbb Q)"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for any proper cocompact action of \\Gamma on X"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if \\Gamma is torsion-free then Bredon groups reduce to ordinary cohomology"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["q1", "e1"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p7-s2-001", "title": "Orbifold Poincar\u00e9 duality for torsion lattices", "question": "Uniform lattices with torsion act properly cocompactly on X=G/K, so the quotient is an orbifold rather than a manifold. Most Poincar\u00e9-duality references assume torsion-free groups. What is the right version of duality for \\Gamma when the stabilizers are finite, and how does one see the dimension d=\\dim X appear in the Bredon cohomology groups H^*_{\\mathcal F}(\\Gamma;\\mathbb Q)?", "answer": "The correct object is the Bredon (or equivalently, orbifold) cohomology of the \\Gamma-action with coefficients in the constant rational Mackey functor. Because every finite subgroup H\\subset\\Gamma fixes a totally geodesic copy of X and acts trivially on the fundamental class, the Bredon chain complex C_*^{\\mathcal F}(X) is a d-dimensional duality complex in the sense of L\u00fcck. Thus cap product with the \\Gamma-invariant class \\[X]\\in H_d^{\\mathcal F}(\\Gamma;\\mathbb Q) yields isomorphisms\\n\\n\\qquad H^i_{\\mathcal F}(\\Gamma;\\mathbb Q)\\xrightarrow{\\ \\cap [X]\\ } H_{d-i}^{\\mathcal F}(\\Gamma;\\mathbb Q).\\n\\nThese Bredon groups agree with the singular cohomology of the orbifold X/\\Gamma, so this is precisely the rational Poincar\u00e9 duality satisfied by X/\\Gamma. When \\Gamma is torsion-free the collection of finite subgroups consists only of the trivial group, and the statement collapses to the familiar duality for manifolds. Hence \\Gamma enjoys a rational PD of formal dimension d even though the quotient is an orbifold.", "tags": ["group-cohomology", "homological-algebra", "algebraic-topology"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "group-theory", "label": "uniform lattice"}, {"id": "t2", "type": "term", "subtype": "algebraic-topology", "label": "Bredon cohomology"}, {"id": "t3", "type": "term", "subtype": "geometry", "label": "orbifold quotient"}, {"id": "t4", "type": "term", "subtype": "algebraic-topology", "label": "duality complex"}, {"id": "t5", "type": "term", "subtype": "algebraic-topology", "label": "Poincar\u00e9 duality"}, {"id": "t6", "type": "term", "subtype": "group-theory", "label": "finite stabilizer"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "H^i_{\\mathcal F}(\\Gamma;\\mathbb Q)\\cong H_{d-i}^{\\mathcal F}(\\Gamma;\\mathbb Q)"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "C_*^{\\mathcal F}(X) \text{ is a duality complex of dimension } d"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "H^*_{\\mathcal F}(\\Gamma;\\mathbb Q)\\cong H^*(X/\\Gamma;\\mathbb Q)"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for any proper cocompact action with finite stabilizers"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if the action is free the orbifold duality reduces to manifold duality"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p7-s3-000", "title": "Applying Fowler's FH(Q) criterion to torsion lattices", "question": "Fowler's FH(\\mathbb Q) condition asks for a proper cocompact \\Gamma-complex whose isotropy lies in a family \\mathcal F and whose fixed-point Euler characteristics vanish. Let \\Gamma be a torsion lattice acting on X=G/K with finite stabilizers. Assuming that every finite subgroup H\\subset\\Gamma has \\chi(X^H)=0 for H\\ne\\{1\\}, why does Fowler's theorem place \\Gamma in FH(\\mathbb Q)?", "answer": "The FH(\\mathbb Q) property means that \\Gamma admits a finite \\Gamma-CW complex Y such that every cell stabilizer is finite and whose Bredon homology with coefficients in \\mathbb Q is finitely generated in each degree. Fowler constructs Y from X by attaching finitely many equivariant cells to kill the compactly supported homology of each fixed-point set X^H. The hypotheses that X is contractible, the action is proper cocompact, and \\chi(X^H)=0 for nontrivial H imply that all obstruction groups vanish, so the cellular chain complex C_*^{\\mathcal F}(Y;\\mathbb Q) becomes finite.\\n\\nConcretely, the spectral sequence with E^1_{p,q}=\\bigoplus_{[\\sigma]} H_q(\\Gamma_{\\sigma};\\mathbb Q) collapses because \\Gamma_{\\sigma} is finite and the Euler vanishing forces acyclicity above degree 0. The resulting Bredon chain complex for Y provides a finite projective resolution of the constant functor \\underline{\\mathbb Q}, so \\Gamma\\in FH(\\mathbb Q). This is the equivariant finiteness conclusion used to show that torsion lattices admit finite rational orbicomplex models even though they need not be fundamental groups of manifolds.", "tags": ["algebraic-topology", "homotopy-theory", "group-theory"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "group-theory", "label": "FH(\\mathbb Q)"}, {"id": "t2", "type": "term", "subtype": "group-theory", "label": "torsion lattice"}, {"id": "t3", "type": "term", "subtype": "algebraic-topology", "label": "Bredon homology"}, {"id": "t4", "type": "term", "subtype": "algebraic-topology", "label": "equivariant CW complex"}, {"id": "t5", "type": "term", "subtype": "algebraic-topology", "label": "Euler characteristic"}, {"id": "t6", "type": "term", "subtype": "algebraic-topology", "label": "spectral sequence"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "E^1_{p,q}=\\bigoplus_{[\\sigma]} H_q(\\Gamma_{\\sigma};\\mathbb Q)"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "\\chi(X^H)=0 \text{ for all }1\\ne H\\subset\\Gamma"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "C_*^{\\mathcal F}(Y;\\mathbb Q) \text{ is finite projective}"}, {"id": "s1", "type": "scope", "subtype": "conditional", "text": "if the action is proper cocompact with finite stabilizers"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "assuming fixed-point Euler characteristics vanish"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t5"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["q1", "e2"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p7-s3-001", "title": "What does Fowler's FH(\u211a) theorem actually provide?", "question": "Fowler's theorem says that if a group \\Gamma acts properly and cocompactly on a contractible complex X with finite stabilizers and the reduced Euler characteristic of every nontrivial fixed set X^H vanishes, then \\Gamma\\in FH(\\mathbb Q). What exactly does this FH(\\mathbb Q) conclusion give, and why does it fall short of producing an actual closed manifold with fundamental group \\Gamma?", "answer": "The FH(\\mathbb Q) property means that the constant rational coefficient functor \\underline{\\mathbb Q} admits a finite length projective resolution over the orbit category \\mathcal O_{\\mathcal F}\\Gamma. Equivalently, \\Gamma has a finite \\Gamma-CW complex Y such that each cell stabilizer is finite and the Bredon chain complex C_*^{\\mathcal F}(Y;\\mathbb Q) is finitely generated. Fowler produces Y by equivariantly killing the compactly supported homology of each fixed-point stratum, and the Euler-vanishing conditions ensure that no obstructions appear.\\n\\nThis conclusion guarantees finiteness at the level of orbicomplexes: X/\\Gamma is homotopy equivalent (over \\Gamma) to a finite CW orbicomplex. However, FH(\\mathbb Q) does not imply the existence of a smooth or topological manifold quotient, because torsion stabilizers remain; one would need torsion-free \\Gamma to upgrade Y/\\Gamma to a manifold. Thus Fowler's theorem provides the finite CW models used in the proof but stops short of manifold realization.", "tags": ["algebraic-topology", "homotopy-theory", "group-theory"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "group-theory", "label": "FH(\\mathbb Q)"}, {"id": "t2", "type": "term", "subtype": "algebraic-topology", "label": "orbicomplex"}, {"id": "t3", "type": "term", "subtype": "group-theory", "label": "finite stabilizer"}, {"id": "t4", "type": "term", "subtype": "algebraic-topology", "label": "Bredon chain complex"}, {"id": "t5", "type": "term", "subtype": "topology", "label": "manifold realization"}, {"id": "t6", "type": "term", "subtype": "algebraic-topology", "label": "Euler characteristic condition"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "\\widetilde \\chi(X^H)=0 \text{ for }1\\ne H\\subset\\Gamma"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "C_*^{\\mathcal F}(Y;\\mathbb Q) \text{ finite }\\Gamma\text{-projective}"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "Y/\\Gamma \text{ is a finite CW orbicomplex}"}, {"id": "s1", "type": "scope", "subtype": "conditional", "text": "if the action is proper cocompact with Euler-vanishing hypotheses"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "only torsion-free groups yield manifold quotients"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t6"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "surface", "ends": ["q1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p7-s3a-000", "title": "Torsion orders in Fowler's arithmetic FH(\u211a) lattices", "question": "Fowler's Section 5 constructs arithmetic lattices in semisimple groups and shows they lie in FH(\\mathbb Q). Which torsion orders can actually occur in these examples, and how do the number-theoretic choices (quadratic fields, quaternion algebras, etc.) control the finite subgroups that appear in the resulting lattices?", "answer": "Start with an absolutely almost simple \\mathbb Q-group \\mathbf G that is anisotropic over \\mathbb Q at infinity (for instance, the norm-one group of a quaternion algebra that ramifies at every real place). Let F/\\mathbb Q be a number field and choose an order \\mathcal O\\subset F. The arithmetic lattice \\Gamma=\\mathbf G(\\mathcal O) embeds cocompactly in the real Lie group G=\\mathbf G(\\mathbb R). Finite subgroups of \\Gamma are precisely the torsion units of \\mathbf G(\\mathcal O), so their orders divide the orders of elements in \\mathbf G(\\mathcal O_F), where F is the splitting field of \\mathbf G.\\n\\nFor quaternion-algebra examples the torsion comes from the roots of unity in F. Choosing F=\\mathbb Q(i) or \\mathbb Q(\\zeta_3) produces lattices with 4- or 6-torsion; taking F with class number one and no nontrivial roots of unity yields torsion-free lattices. Thus Fowler's arithmetic constructions realize every torsion order that already occurs among the units of the chosen number field. Each such lattice still lies in FH(\\mathbb Q) because the associated orbicomplex satisfies the fixed-set Euler-vanishing hypothesis, but only the torsion-free specializations give genuine manifold quotients.", "tags": ["algebraic-groups", "number-theory", "group-theory"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "group-theory", "label": "arithmetic lattice"}, {"id": "t2", "type": "term", "subtype": "number-theory", "label": "number field"}, {"id": "t3", "type": "term", "subtype": "number-theory", "label": "quaternion algebra"}, {"id": "t4", "type": "term", "subtype": "group-theory", "label": "torsion unit"}, {"id": "t5", "type": "term", "subtype": "group-theory", "label": "roots of unity"}, {"id": "t6", "type": "term", "subtype": "group-theory", "label": "FH(\\mathbb Q)"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "\\Gamma=\\mathbf G(\\mathcal O) \\subset \\mathbf G(\\mathbb R)"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "\\text{torsion}(\\Gamma)=\\mu(F)"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "F=\\mathbb Q(\\zeta_n) \\Rightarrow n\text{-torsion in }\\Gamma"}, {"id": "s1", "type": "scope", "subtype": "conditional", "text": "if the chosen number field has given roots of unity"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "torsion-free occurs when F has no nontrivial roots of unity"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["q1", "e1"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p7-s3a-001", "title": "Explicit FH(\u211a) lattices with prescribed torsion", "question": "Fowler's arithmetic FH(\\mathbb Q) lattices are built from anisotropic quaternion algebras over number fields. If I want an explicit cocompact lattice whose torsion is exactly the cyclic group of order 5 (or order n in general), how should I choose the field and order, and why does this construction still land in FH(\\mathbb Q) even though the resulting quotient is only an orbicomplex?", "answer": "Pick a number field F containing the desired cyclic group of roots of unity \\mu_n(F). For example, take F=\\mathbb Q(\\zeta_5) and let B be the unique quaternion algebra over F that ramifies at every real place (there are none here) and at a pair of finite places so that B is a division algebra. Let \\mathcal O\\subset B be a maximal order and set \\Gamma=\\mathcal O^{1} (norm-one elements). The embedding B\\otimes_{F,\\sigma}\\mathbb R\\cong \\mathbf H gives a homomorphism \\Gamma\\hookrightarrow G=\\operatorname{SU}(2)^r, whose projection to one factor yields a uniform lattice.\\n\\nThe torsion of \\Gamma consists of the units of \\mathcal O, and these units map onto \\mu_n(F). By choosing F with prescribed roots of unity one realizes exactly those torsion orders. The action on the associated symmetric space satisfies Fowler's Euler-vanishing hypothesis because every fixed-point set is contractible and has zero reduced Euler characteristic. Hence \\Gamma\\in FH(\\mathbb Q), producing a finite rational orbicomplex even though the torsion prevents a manifold quotient.", "tags": ["algebraic-groups", "number-theory", "group-theory"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "number-theory", "label": "cyclotomic field"}, {"id": "t2", "type": "term", "subtype": "number-theory", "label": "quaternion algebra"}, {"id": "t3", "type": "term", "subtype": "group-theory", "label": "maximal order"}, {"id": "t4", "type": "term", "subtype": "group-theory", "label": "torsion unit"}, {"id": "t5", "type": "term", "subtype": "group-theory", "label": "FH(\\mathbb Q)"}, {"id": "t6", "type": "term", "subtype": "geometry", "label": "orbicomplex"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "\\Gamma=\\mathcal O^{1} \\subset B^{\times}"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "\\operatorname{tors}(\\Gamma)=\\mu_n(F)"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "F=\\mathbb Q(\\zeta_n) \\Rightarrow n\text{-torsion in }\\Gamma"}, {"id": "s1", "type": "scope", "subtype": "conditional", "text": "if the number field contains \\mu_n"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "torsion obstructs manifold quotients but not FH(\\mathbb Q)"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p7-s4-000", "title": "When do Rankin\u2013Selberg and Godement\u2013Jacquet conductors coincide?", "question": "Let F be a non-archimedean local field with additive character \\psi of conductor \\mathfrak o_F, and let \\Pi be an irreducible generic representation of GL_n(F) with Whittaker model \\mathcal W(\\Pi,\\psi). Denote by W_0 the Casselman new vector normalized by W_0(1)=1. For any generic representation \\pi of GL_m(F) with Whittaker new vector W'_0 consider the translated Rankin\u2013Selberg integral\\n\\nZ(s,W_0,W'_0;u_Q)=\\int_{N_m\\\\backslash GL_m(F)} W_0(j(g)u_Q) W'_0(g) |\\det g|^{s-(n-1)/2}\\,dg.\\n\\nExpositions often claim that one can vary only the unipotent element u_Q to match the conductor of \\pi, and that this forces the Rankin\u2013Selberg conductor to agree with the Godement\u2013Jacquet conductor exponent f(\\Pi\\times\\pi). What hypotheses ensure this equality, and why is W_0 a universal choice once u_Q is allowed to depend on \\pi?", "answer": "Fix \\psi with conductor \\mathfrak o_F and let W_0 be the Casselman\u2013Shalika new vector, so that W_0 is right invariant under K_1(\\mathfrak p^{c(\\Pi)}) and its support lies in N T^{+} K_1(\\mathfrak p^{c(\\Pi)}). The Casselman\u2013Shalika formula shows that on a diagonal element a=\\operatorname{diag}(\\varpi^{\\lambda_1},\\dots,\\varpi^{\\lambda_n}) with \\lambda_1\\geq\\cdots\\geq\\lambda_n\\geq 0, the value W_0(a) equals \\Delta(a)^{1/2} times the Satake polynomial of \\Pi evaluated at q^{-\\lambda_i}. Consequently Z(s,W_0,W'_0;u_Q) vanishes unless the lower-left block of j(g)u_Q carries at least c(\\pi) powers of \\varpi; this is the same congruence restriction defining new vectors for GL_m.\\n\\nChoose u_Q in the mirabolic subgroup whose reduction is the identity modulo \\mathfrak p^{c(\\Pi)} except for a single row that encodes the valuations demanded by Q. Because u_Q\\in K_1(\\mathfrak p^{c(\\Pi)}) N, the translate R(u_Q)W_0 still lies in the one-dimensional space of K_1(\\mathfrak p^{c(\\Pi)})-fixed Whittaker functions, so it equals W_0 up to a nonzero scalar and remains a test vector. For any generic \\pi with conductor c(\\pi), pick a JPSS new vector W'_0 fixed by K_1(\\mathfrak p^{c(\\pi)}). The local functional equation of Jacquet\u2013Piatetski-Shapiro\u2013Shalika then yields\\n\\n\\varepsilon(s,\\Pi\\times\\pi,\\psi)=q^{-(c(\\Pi)+c(\\pi))(s-1/2)}\\cdot\\gamma_0,\\n\\nwhere \\gamma_0 is a unit independent of s. Comparing both sides shows that f_{RS}(\\Pi\\times\\pi)=c(\\Pi)+c(\\pi): the u_Q-translate enforces exactly the conductor predicted by Godement\u2013Jacquet because the matrix coefficients entering the integral vanish for smaller exponents, while scaling by \\varpi^{c(\\pi)} introduces the required power of q^{-s}. Hence a single W_0 suffices; all conductor variation is absorbed by u_Q and W'_0, so the Rankin\u2013Selberg integral matches the Godement\u2013Jacquet conductor and the \\varepsilon-factor constraints of JPSS (1981, \u00a75).", "tags": ["number-theory", "automorphic-forms", "l-functions"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "representation-theory", "label": "Whittaker new vector"}, {"id": "t2", "type": "term", "subtype": "representation-theory", "label": "Casselman\u2013Shalika formula"}, {"id": "t3", "type": "term", "subtype": "number-theory", "label": "Rankin\u2013Selberg integral"}, {"id": "t4", "type": "term", "subtype": "number-theory", "label": "Godement\u2013Jacquet conductor"}, {"id": "t5", "type": "term", "subtype": "number-theory", "label": "epsilon factor"}, {"id": "t6", "type": "term", "subtype": "representation-theory", "label": "unipotent translate"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "Z(s,W_0,W'_0;u_Q)=\\int_{N_m\\backslash GL_m(F)} W_0(j(g)u_Q) W'_0(g) |\\det g|^{s-(n-1)/2}\\,dg"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "\\operatorname{supp}(W_0)\\subset N T^{+} K_1(\\mathfrak p^{c(\\Pi)})"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "\\varepsilon(s,\\Pi\\times\\pi,\\psi)=q^{-(c(\\Pi)+c(\\pi))(s-1/2)}"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for every generic \\Pi,\\pi with fixed additive character"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if u_Q matches the conductor congruence of \\pi"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["q1", "t4"]}, {"type": "mention", "ends": ["q1", "t6"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["q1", "e1"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p7-s4-001", "title": "How to kill the Wall obstruction when upgrading an FH(\u211a) complex?", "question": "Let X be a finite CW complex whose rational homology agrees with that of a closed n-manifold (an FH(\\mathbb Q) complex in our notation), and assume \\pi_1(X)=\\Gamma carries the 2-torsion lattice used in the proof. Suppose a degree-one normal map f:M^n\\to X with stable normal bundle classified by \\nu has already been built. Wall's surgery exact sequence says that the obstruction to replacing X by a closed manifold M' homotopy equivalent to X is the element\\n\\n\\theta(\\eta(f)) \\in L_n^{\\langle1\\rangle}(\\mathbb Z[\\Gamma]),\\n\\nwhere \\eta(f)\\in[X,G/TOP] is the normal invariant of f. Which conditions on \\eta(f) and on the L-group ensure this obstruction vanishes, and how does one see that the torsion in \\Gamma does not reintroduce an obstruction while keeping \\pi_1(M')\\cong\\Gamma?", "answer": "Because X is a rational Poincar\\'e complex, the usual Postnikov tower plus Sullivan's rational surgery produces a degree-one normal map f whose normal invariant lives in [X,G/TOP]\\cong H^0(X;\\mathbb Z/2)\\oplus H^2(X;\\mathbb Z/2)\\oplus H^4(X;\\mathbb Z)\\oplus\\cdots. Changing f within its bordism class changes \\eta(f) by an arbitrary element of this cohomology group, so we may hunt for \\eta with trivial Wall obstruction. The relevant part of the exact sequence\\n\\n0\\to S^{TOP}(X)\\to[X,G/TOP]\\xrightarrow{\\theta} L_n^{\\langle1\\rangle}(\\mathbb Z[\\Gamma])\\to0\\n\\npairs each normal invariant with its surgery obstruction. For the chosen 2-torsion lattice, the assembly map identifies L_n^{\\langle1\\rangle}(\\mathbb Z[\\Gamma])\\otimes\\mathbb Q with H_n(B\\Gamma;\\mathbb Q)\\oplus H_{n-4}(B\\Gamma;\\mathbb Q)\\oplus\\cdots, but B\\Gamma=B K has only even-dimensional rational homology inherited from the FH(\\mathbb Q) model. The summands in degree n, n-4, ... all vanish because torsion in \\Gamma forces these groups to be finite, hence zero after tensoring with \\mathbb Q. Thus L_n^{\\langle1\\rangle}(\\mathbb Z[\\Gamma]) is torsion, generated by 2-primary classes detected
