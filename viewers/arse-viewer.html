 by the reduced w_2 and w_4 of the normal invariant. By choosing \\eta(f) so that these characteristic classes match those of the FH(\\mathbb Q) tangent microbundle, we force \\theta(\\eta(f))=0.\\n\\nWith the obstruction gone, the exact sequence shows that \\eta(f) lifts to an element of the structure set S^{TOP}(X), i.e. to a closed manifold M' together with a simple homotopy equivalence M'\\to X inducing an isomorphism on \\pi_1. Normal invariants that differ by elements of [X,G/TOP] correspond to performing tangential surgeries on embedded spheres; these do not change \\pi_1 because all handles of index 1 and n-1 are attached along null-homotopic loops (the attaching spheres represent zero in H_1 thanks to FH(\\mathbb Q)). Consequently M' is a closed manifold, shares \\pi_1 with X, and realizes the FH(\\mathbb Q) data once the L-group obstruction is neutralized.", "tags": ["algebraic-topology", "manifolds", "differential-topology"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "algebraic-topology", "label": "FH(\\mathbb Q) complex"}, {"id": "t2", "type": "term", "subtype": "topology", "label": "degree-one normal map"}, {"id": "t3", "type": "term", "subtype": "topology", "label": "normal invariant"}, {"id": "t4", "type": "term", "subtype": "algebraic-topology", "label": "Wall L-group"}, {"id": "t5", "type": "term", "subtype": "algebraic-topology", "label": "Wall surgery exact sequence"}, {"id": "t6", "type": "term", "subtype": "group-theory", "label": "2-torsion lattice \\Gamma"}, {"id": "t7", "type": "term", "subtype": "topology", "label": "structure set"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "\\theta(\\eta(f)) \\in L_n^{\\langle1\\rangle}(\\mathbb Z[\\Gamma])"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "0\\to S^{TOP}(X)\\to[X,G/TOP]\\xrightarrow{\\theta} L_n^{\\langle1\\rangle}(\\mathbb Z[\\Gamma])\\to0"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "L_n^{\\langle1\\rangle}(\\mathbb Z[\\Gamma])\\otimes\\mathbb Q \\cong H_n(B\\Gamma;\\mathbb Q)\\oplus H_{n-4}(B\\Gamma;\\mathbb Q)\\oplus\\cdots"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for every FH(\\mathbb Q) complex with \\pi_1=\\Gamma"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if the rationalized L-group vanishes"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["q1", "t4"]}, {"type": "mention", "ends": ["q1", "t6"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "mention", "ends": ["a1", "t7"]}, {"type": "surface", "ends": ["q1", "e1"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p7-s5-000", "title": "Why Smith theory imposes no rational obstruction for free Z/2-actions", "question": "Let X be a finite CW-complex that is rationally acyclic (H_i(X;\\mathbb Q)=0 for i>0) and let \\tau act cellularly with \\tau^2=1. Classical Smith theory says that the fixed set X^{\\langle\\tau\\rangle} controls H_*(X;\\mathbb Z/2), and many texts conclude that Z/2-actions on mod-2 acyclic complexes have fixed points. Why does this argument fail over \\mathbb Q? More concretely, how do transfer and averaging show that a free \\mathbb Z/2-action on a rationally acyclic space produces no obstruction, even though the mod-2 Smith inequalities still hold?", "answer": "Smith theory is inherently p-local: the Smith chains are the subcomplexes of the cellular chain complex C_*(X;\\mathbb F_p) obtained by restricting and averaging with respect to \\tau. When the coefficient field has characteristic p, the operator 1+\\tau is nilpotent, so one obtains a long exact sequence relating H_*(X;\\mathbb F_p) to H_*(X^{\\langle\\tau\\rangle};\\mathbb F_p), forcing nontrivial fixed-point homology whenever X is mod-p acyclic. In characteristic zero, 1+\\tau is invertible, and the same chain-level argument collapses. Instead we have a transfer map tr:H_*(X/\\tau;\\mathbb Q)\\to H_*(X;\\mathbb Q) defined by averaging preimages, and it satisfies tr\\circ\\pi_*=2\\,id_{H_*(X;\\mathbb Q)}. Because 2 is invertible in \\mathbb Q, \\pi_* is injective and every class in H_*(X;\\mathbb Q) is 2 times the transfer of a class downstairs. Thus H_*(X;\\mathbb Q) carries no information about X^{\\langle\\tau\\rangle}.\\n\\nIf the action is free, \\pi:X\\to X/\\tau is a covering of degree 2 and the transfer shows H_*(X/\\tau;\\mathbb Q)\\cong H_*(X;\\mathbb Q)^\\tau. For a rationally acyclic X this invariant subspace vanishes, so X/\\tau is also rationally acyclic and there is no contradiction with Smith theory. The only nontrivial constraints live in mod-2 homology, where 2 is no longer invertible: there the Smith complex detects fixed-point data through the short exact sequence 0\\to C_*(X^{\\langle\\tau\\rangle};\\mathbb F_2)\\to C_*(X;\\mathbb F_2)\\xrightarrow{1+\\tau} C_*(X;\\mathbb F_2)\\to 0. Consequently, mod-2 Smith theory continues to impose fixed-point obstructions, but rational coefficients bypass them entirely because averaging by 1/2 kills the obstruction.", "tags": ["algebraic-topology", "group-theory", "homology-cohomology"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "algebraic-topology", "label": "Smith theory"}, {"id": "t2", "type": "term", "subtype": "algebraic-topology", "label": "rationally acyclic space"}, {"id": "t3", "type": "term", "subtype": "group-theory", "label": "free Z/2-action"}, {"id": "t4", "type": "term", "subtype": "homology", "label": "transfer map"}, {"id": "t5", "type": "term", "subtype": "homology", "label": "fixed-point set"}, {"id": "t6", "type": "term", "subtype": "homology", "label": "mod-p homology"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "\\\\operatorname{tr}\\\\circ\\\\pi_* = 2\\\\,id_{H_*(X;\\\\mathbb Q)}"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "H_*(X/\\\\tau;\\\\mathbb Q) \\\\cong H_*(X;\\\\mathbb Q)^{\\\\langle\\\\tau\\\\rangle}"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "0\\\\to C_*(X^{\\\\langle\\\\tau\\\\rangle};\\\\mathbb F_2)\\\\to C_*(X;\\\\mathbb F_2)\\\\xrightarrow{1+\\\\tau} C_*(X;\\\\mathbb F_2)\\\\to 0"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for any finite CW-complex with a Z/2-action"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if the coefficient field has characteristic different from 2"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["q1", "t5"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p7-s5-001", "title": "Rational Smith theory for free involutions on acyclic complexes", "question": "Let Y be a finite CW complex with a cellular involution \\tau and assume H_*(Y;\\mathbb Q)=0. In the proof we let Z/2 act freely on such a space coming from the universal cover of a fake projective space. Textbooks on Smith theory usually state that the fixed-point set of a p-group action on a mod-p acyclic complex is again mod-p acyclic, which sounds like an obstruction to free actions. Could someone spell out why this reasoning does not apply with rational coefficients? In particular, if \\tau acts freely, what becomes of the Smith complex over \\mathbb Q, and how does one see that Y/\\tau is still rationally acyclic while Y^{\\langle\\tau\\rangle}=\\varnothing?", "answer": "The Smith complex is built from C_*(Y;\\mathbb F_p) with the maps 1\\pm\\tau, and its exactness uses the equality (1-\\tau)(1+\\tau)=0 inside \\mathbb F_p[\\mathbb Z/2]. When the characteristic is p, the operator 1+\\tau is nilpotent on chains, so the short exact sequence 0\\to C_*(Y^{\\langle\\tau\\rangle};\\mathbb F_p)\\to C_*(Y;\\mathbb F_p)\\xrightarrow{1+\\tau} C_*(Y;\\mathbb F_p)\\to0 produces the usual Smith long exact sequence and forces nonzero homology in the fixed points whenever Y is mod-p acyclic. Over \\mathbb Q the algebra changes: the group ring decomposes as \\mathbb Q[\\mathbb Z/2]\\cong\\mathbb Q\\oplus\\mathbb Q, so the averaging idempotent e_+=\\tfrac{1}{2}(1+\\tau) is invertible on the +1 eigenspace. The chain map 1+\\tau now splits C_*(Y;\\mathbb Q) into \\pm-eigenspaces, and the putative Smith exact sequence collapses because e_+ is an automorphism.\\n\\nWhen \\tau acts freely, the covering projection \\pi:Y\\to Y/\\tau admits a rational transfer tr defined by averaging lifts. It satisfies the identities\\n\\ntr\\circ\\pi_*=2\\,id_{H_*(Y;\\mathbb Q)},\\qquad \\pi_*\\circ tr=2\\,id_{H_*(Y/\\tau;\\mathbb Q)}.\\n\\nSince 2 is invertible, \\pi_* and tr are isomorphisms onto the \\pm-eigenspaces, and H_*(Y/\\tau;\\mathbb Q)\\cong H_*(Y;\\mathbb Q)^\\tau=0 when Y is rationally acyclic. Nothing forces a fixed set because the entire argument relied on characteristic p. Thus a free Z/2-action on a rationally acyclic complex is compatible with Smith theory: the mod-2 version still predicts fixed points (indeed, Y^{\\langle\\tau\\rangle}=\\varnothing implies H_*(Y;\\mathbb F_2)\\neq0), but in characteristic zero the averaging idempotent kills the obstruction and the quotient remains rationally acyclic.", "tags": ["algebraic-topology", "group-theory", "homology-cohomology"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "algebraic-topology", "label": "Smith complex"}, {"id": "t2", "type": "term", "subtype": "homology", "label": "rational homology"}, {"id": "t3", "type": "term", "subtype": "group-theory", "label": "free involution"}, {"id": "t4", "type": "term", "subtype": "homology", "label": "transfer map"}, {"id": "t5", "type": "term", "subtype": "homology", "label": "fixed-point set"}, {"id": "t6", "type": "term", "subtype": "algebra", "label": "averaging idempotent"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "0\\\\to C_*(Y^{\\\\langle\\\\tau\\\\rangle};\\\\mathbb F_p)\\\\to C_*(Y;\\\\mathbb F_p)\\\\xrightarrow{1+\\\\tau} C_*(Y;\\\\mathbb F_p)\\\\to0"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "e_+=\\\\tfrac{1}{2}(1+\\\\tau)\\\\in\\\\mathbb Q[\\\\mathbb Z/2]"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "\\\\operatorname{tr}\\\\circ\\\\pi_*=2\\\\,id_{H_*(Y;\\\\mathbb Q)},\\\\quad \\\\pi_*\\\\circ\\\\operatorname{tr}=2\\\\,id_{H_*(Y/\\\\tau;\\\\mathbb Q)}"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for any finite CW-complex with a Z/2-action"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if \tau acts freely and coefficients have char 0"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["q1", "t5"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p7-s6-000", "title": "From rational PD groups to closed manifolds via surgery", "question": "Let \\Gamma be a finitely presented group whose cohomology satisfies rational Poincar\\'e duality of dimension n. The proof sketch claims that once \\Gamma embeds as the fundamental group of an FH(\\mathbb Q) complex and the relevant surgery obstruction disappears, one can realize \\Gamma as the \\pi_1 of a closed n-manifold. What are the precise obstruction groups that appear in this composite process? In particular, how do Wall's finiteness obstruction, the rational Poincar\\'e complex produced from \\Gamma, and the L_n(\\mathbb Z[\\Gamma]) surgery obstruction fit together to yield an actual manifold?", "answer": "There are three layers. First one needs a finite complex that has \\Gamma as its fundamental group. Wall's finiteness obstruction is the class\\n\\n\\omega(\\Gamma)\\in K_0(\\mathbb Z[\\Gamma])\\cong \\\\widetilde K_0(\\mathbb Z[\\Gamma])\\oplus\\mathbb Z,\\n\\nwhich vanishes if and only if the universal cover of the classifying space has a finite \\mathbb Z[\\Gamma]-resolution. The 2-torsion lattices considered here are of type F, so \\omega(\\Gamma)=0 and we obtain a finite CW-complex X with \\pi_1(X)=\\Gamma. The cohomological assumption gives cap-product isomorphisms H^i(X;\\mathbb Q)\\\\cong H_{n-i}(X;\\mathbb Q); thus X is an FH(\\mathbb Q)-complex, i.e. a rational Poincar\\'e complex.\\n\\nSecond, a degree-one normal map f:M^n\\\\rightarrow X is constructed by thickening the n-skeleton of X and stabilizing the normal bundle. Its normal invariant \\eta(f)\\\\in[X,G/TOP] records whether f is normally cobordant to a homotopy equivalence. This class maps to Wall's surgery obstruction\\n\\n\\theta(f)\\\\in L_n(\\mathbb Z[\\Gamma]),\\n\\nvia the surgery exact sequence 0\\\\to S^{TOP}(X)\\\\to[X,G/TOP]\\\\xrightarrow{\\theta}L_n(\\mathbb Z[\\Gamma]). The third layer is therefore purely algebraic: compute L_n(\\mathbb Z[\\Gamma]) for the chosen lattice. In the 2-torsion cases the assembly map shows that L_n(\\mathbb Z[\\Gamma]) is torsion and the specific class \\theta(f) vanishes after arranging the required characteristic classes.\\n\\nWhen \\theta(f)=0, the normal invariant lifts to the structure set S^{TOP}(X), and we obtain a closed manifold M together with a simple homotopy equivalence M\\\\to X inducing an isomorphism on \\pi_1. Summarizing: \\omega(\\Gamma)=0 ensures finiteness (FH(\\mathbb Q)), the rational Poincar\\'e duality of \\Gamma identifies the homotopy type to which surgery is applied, and the vanishing of \\theta(f) in L_n(\\mathbb Z[\\Gamma]) removes the final obstruction. Under these conditions \\Gamma is realized as \\pi_1 of a closed manifold obtained by composing finiteness theory and surgery.", "tags": ["algebraic-topology", "manifolds", "homotopy-theory"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "algebraic-topology", "label": "rational Poincar'e duality group"}, {"id": "t2", "type": "term", "subtype": "algebraic-topology", "label": "finiteness obstruction"}, {"id": "t3", "type": "term", "subtype": "algebraic-topology", "label": "FH(\\mathbb Q) complex"}, {"id": "t4", "type": "term", "subtype": "topology", "label": "degree-one normal map"}, {"id": "t5", "type": "term", "subtype": "algebraic-topology", "label": "Wall L-group"}, {"id": "t6", "type": "term", "subtype": "topology", "label": "structure set"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "\\omega(\\Gamma)\\\\in K_0(\\mathbb Z[\\Gamma])"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "\\theta(f)\\\\in L_n(\\mathbb Z[\\Gamma])"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "0\\\\to S^{TOP}(X)\\\\to[X,G/TOP]\\\\xrightarrow{\\theta}L_n(\\mathbb Z[\\Gamma])"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for any rational PD group of type F"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if both \\omega(\\Gamma) and \\theta(f) vanish"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["q1", "t5"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p7-s6-001", "title": "Composing finiteness and surgery for rational PD groups", "question": "Rational Poincar\\'e duality groups are often said to behave like fundamental groups of closed manifolds. Suppose \\Gamma is such a group in dimension n, \\omega(\\Gamma)\\in\\\\widetilde K_0(\\mathbb Z[\\Gamma]) vanishes, and the 2-torsion lattice hypotheses guarantee the relevant L-group assembly map is zero. How do these ingredients combine to produce an actual closed n-manifold with \\pi_1=\\Gamma? In particular, how do we pass from the algebraic PD condition to an FH(\\mathbb Q) complex, then to a degree-one normal map, and finally through Wall's surgery exact sequence to eliminate the obstruction class?", "answer": "Start with the finiteness obstruction. A finitely presented PD_n^{\\mathbb Q} group \\Gamma has a classifying space B\\Gamma whose universal cover is \\mathbb Q-acyclic. Wall's obstruction \\omega(\\Gamma)\\in\\\\widetilde K_0(\\mathbb Z[\\Gamma]) measures whether this \\mathbb Z[\\Gamma]-complex is chain-homotopy equivalent to a finite complex. The assumption \\omega(\\Gamma)=0 lets us replace B\\Gamma by a finite CW complex X with \\pi_1(X)=\\Gamma. Because \\Gamma is PD_n^{\\mathbb Q}, cap product with the fundamental class in H_n(X;\\mathbb Q) furnishes isomorphisms H^i(X;\\mathbb Q)\\\\cong H_{n-i}(X;\\mathbb Q), so X is a rational Poincar\\'e (FH(\\mathbb Q)) complex.\\n\\nNext we build a geometric representative. Take the n-skeleton of X, attach handles to obtain an n-manifold with boundary, and double it to obtain an n-manifold M together with a degree-one map f:M\\\\to X. Stabilizing the normal bundle gives a well-defined normal invariant \\eta(f)\\\\in[X,G/TOP]. The Wall surgery machine packages the remaining obstruction into\\n\\n\\theta(\\eta(f))\\\\in L_n^{\\\\langle1\\\\rangle}(\\mathbb Z[\\Gamma]),\\n\\ncomputed via the exact sequence 0\\\\to S^{TOP}(X)\\\\to[X,G/TOP]\\\\xrightarrow{\\theta}L_n^{\\\\langle1\\\\rangle}(\\mathbb Z[\\Gamma]). The 2-torsion lattice hypotheses ensure that the assembly map H_n(B\\Gamma;\\mathbb L_0)\\\\to L_n^{\\\\langle1\\\\rangle}(\\mathbb Z[\\Gamma]) is trivial, so the obstruction lives in a torsion subgroup generated by low-degree characteristic classes. By adjusting \\eta(f) within [X,G/TOP] (changing the normal data on finitely many cells) we can arrange \\theta(\\eta(f))=0.\\n\\nOnce the obstruction vanishes, \\eta(f) lifts to the structure set S^{TOP}(X). This lift corresponds to a closed manifold N and a simple homotopy equivalence N\\\\to X inducing \\pi_1(N)\\\\cong\\Gamma. Thus the chain of implications is: \\omega(\\Gamma)=0 \\Rightarrow finite FH(\\mathbb Q) complex \\Rightarrow degree-one normal map \\Rightarrow surgery obstruction in L_n^{\\\\langle1\\\\rangle}(\\mathbb Z[\\Gamma]) \\Rightarrow (after vanishing) a genuine closed manifold with fundamental group \\Gamma.\\n\\nIn short, finiteness gives a space of the right homotopy type, rational PD ensures it satisfies the Poincar\\'e duality hypotheses of surgery theory, and the vanishing of the L-group obstruction completes the passage to the manifold category.", "tags": ["algebraic-topology", "manifolds", "homotopy-theory"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "algebraic-topology", "label": "rational Poincar\u00e9 duality group"}, {"id": "t2", "type": "term", "subtype": "algebraic-topology", "label": "Wall finiteness obstruction"}, {"id": "t3", "type": "term", "subtype": "algebraic-topology", "label": "FH(\\mathbb Q) complex"}, {"id": "t4", "type": "term", "subtype": "topology", "label": "degree-one normal map"}, {"id": "t5", "type": "term", "subtype": "algebraic-topology", "label": "L-group assembly"}, {"id": "t6", "type": "term", "subtype": "topology", "label": "structure set"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "\\\\omega(\\\\Gamma)\\\\in\\\\widetilde K_0(\\\\mathbb Z[\\\\Gamma])"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "H^i(X;\\\\mathbb Q)\\\\cong H_{n-i}(X;\\\\mathbb Q)"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "\\\\theta(\\\\eta(f))\\\\in L_n^{\\\\langle1\\\\rangle}(\\\\mathbb Z[\\\\Gamma])"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for any finitely presented PD_n^{\\mathbb Q} group"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if \\omega(\\Gamma)=0 and the L-group assembly vanishes"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["q1", "t5"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p8-problem-000", "title": "When does a 4-face vertex admit a symplectic splitting?", "question": "In (\\mathbb R^4,\\omega_0=dx_1\\wedge dy_1+dx_2\\wedge dy_2) let K be a polyhedral surface whose faces are embedded Lagrangian triangles. Each vertex p is incident to four faces, so the tangent cone C_pK is generated by four oriented rays v_1,\\dots,v_4 lying in Lagrangian 2-planes. Many smoothing arguments implicitly assume that C_pK splits as a direct sum of two transverse Lagrangian cones, i.e. that the rays can be paired into Lagrangian bases of complementary planes. What concrete conditions on the v_i ensure such a symplectic splitting exists, and why does this nondegeneracy provide a local Hamiltonian smoothing of the vertex star?", "answer": "After a symplectic change of coordinates we may assume p=0 and \\omega_0 has the standard matrix J. A 2-plane \\Lambda\\subset\\mathbb R^4 is Lagrangian iff \\omega_0 restricts to zero on it, equivalently if a spanning pair (a,b) satisfies \\omega_0(a,b)=0. For a vertex star with four edges meeting cyclically, we obtain primitive tangent vectors v_1,\\dots,v_4 along the edges of the incident faces. The tangent cone splits as \\Lambda_+\\cup\\Lambda_- with \\Lambda_+=\\operatorname{span}\\{v_i,v_{i+2}\\} and \\Lambda_- = \\operatorname{span}\\{v_{i+1},v_{i+3}\\} (indices mod 4) exactly when two conditions hold:\\n\\n1. **Lagrangian pairing:** \\omega_0(v_i,v_{i+2})=0=\\omega_0(v_{i+1},v_{i+3}) so that each opposite pair spans a Lagrangian plane.\\n2. **Nondegeneracy:** The bivectors v_i\\wedge Jv_i satisfy v_1\\wedge Jv_1+v_3\\wedge Jv_3 = 0 and v_2\\wedge Jv_2+v_4\\wedge Jv_4 = 0, ensuring that \\Lambda_+\\oplus\\Lambda_- = T_0\\mathbb R^4 as a direct sum. Geometrically this says that the projections of the four rays to the Lagrangian Grassmannian \\Lambda(2) land at two transverse points, so the vertex star is modeled on the union of two transverse Lagrangian half-planes.\\n\\nWhen these conditions hold one can express the star as the union of two exact Lagrangian cones that meet cleanly along the two edges forming \\Lambda_+\\cap\\Lambda_-. In Darboux coordinates the neighborhood is Hamiltonian isotopic to the union \\{y_1=0,y_2=0\\}\\cup\\{x_1=0,x_2=0\\}. One then chooses a bump function \\rho(r) and solves the Cauchy\u2013Riemann equation for a generating function F(x_1,x_2) whose graph interpolates between the two cones, keeping \\partial F on the boundary rays to preserve the combinatorics. Because \\Lambda_+\\oplus\\Lambda_-=T_0\\mathbb R^4 and the rays form a symplectic basis, the resulting graph L_F is the image of the vertex star under a compactly supported Hamiltonian isotopy, giving a smooth Lagrangian patch. If the balancing condition fails (e.g. \\omega_0(v_i,v_{i+2})\\neq 0) the two cones cannot be made complementary, so any attempted smoothing forces \\omega_0 to acquire nonzero restriction, obstructing a Lagrangian smoothing. Thus the symplectic splitting criterion is precisely what guarantees the existence of a Lagrangian smoothing at a 4-face vertex.", "tags": ["symplectic-geometry", "differential-topology", "manifolds"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "symplectic-geometry", "label": "polyhedral Lagrangian"}, {"id": "t2", "type": "term", "subtype": "symplectic-geometry", "label": "vertex star"}, {"id": "t3", "type": "term", "subtype": "symplectic-geometry", "label": "Lagrangian cone"}, {"id": "t4", "type": "term", "subtype": "symplectic-geometry", "label": "symplectic basis"}, {"id": "t5", "type": "term", "subtype": "symplectic-geometry", "label": "Hamiltonian smoothing"}, {"id": "t6", "type": "term", "subtype": "geometry", "label": "generating function"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "\\omega_0 = dx_1\\\\wedge dy_1 + dx_2\\\\wedge dy_2"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "\\omega_0(v_i,v_{i+2}) = 0"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "v_1\\\\wedge Jv_1 + v_3\\\\wedge Jv_3 = 0 = v_2\\\\wedge Jv_2 + v_4\\\\wedge Jv_4"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for any vertex where four Lagrangian faces meet"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if the tangent rays satisfy the Lagrangian pairing and balancing equalities"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["q1", "t4"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["q1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p8-problem-001", "title": "Maslov-angle test for smoothing Lagrangian vertices", "question": "Let K\\subset(\\mathbb R^4,\\omega_0) be a polyhedral Lagrangian whose vertices have valence four. Fix a vertex p and choose unit edge directions w_1,\\dots,w_4 arranged cyclically. Each oriented line w_i spans a Lagrangian plane with its successor, and we can attach to it a Maslov angle \\theta_i\\in S^1 by writing w_i+iJw_i\\in\\mathbb C^2. How can one tell from the \\theta_i (or equivalently from the symplectic Gram matrix G_{ij}=\\omega_0(w_i,Jw_j)) whether the star admits a decomposition T_p\\mathbb R^4=\\Lambda_1\\oplus\\Lambda_2 into complementary Lagrangian planes? Why is this Maslov ordering exactly what is needed to perform a local Lagrangian smoothing of the vertex?", "answer": "For four Lagrangian rays the Maslov angles record their position in the Lagrangian Grassmannian \\Lambda(2)\\cong S^1. A pair of rays \\{w_i,w_j\\} spans a Lagrangian plane iff their angles differ by \\pi (mod 2\\pi). Therefore a necessary and sufficient condition for a direct sum decomposition is:\\n\\n- After reordering, the angles satisfy \\theta_1+\\theta_3\\equiv\\theta_2+\\theta_4\\equiv\\pi (mod 2\\pi), and the two sums are distinct (so the planes are transverse).\\n\\nIn linear algebra terms this says the symplectic Gram matrix\\n\\nG_{ij}=\\omega_0(w_i,Jw_j)\\n\\nhas block form \\begin{pmatrix}0 & D\\\\ -D & 0\\end{pmatrix} under a permutation of the basis, with D diagonal and \\det D\\neq0. Equivalently, the bivectors w_1\\wedge w_3 and w_2\\wedge w_4 span the kernel of \\omega_0 on \\bigwedge^2 T_p\\mathbb R^4. When this happens the vertex star splits into two Lagrangian half-planes that intersect only along the two shared edges; the tangent cone is symplectomorphic to \\{y_1=0\\}\\cup\\{x_1=0\\}.\\n\\nThe Maslov ordering controls smoothing because the Lagrangian angle extends continuously across exact Lagrangians. If the four angles alternate (\\theta_1<\\theta_2<\\theta_3<\\theta_4\\) with \\theta_{i+2}=\\theta_i+\\pi), one can choose a small disk D\\subset\\Lambda_1 and solve for a generating function F:D\\to\\mathbb R whose differential interpolates between the two cones while preserving the boundary data on each edge. The resulting graph remains Lagrangian because \\partial D is mapped to the alternating angles, ensuring the Maslov class of the patch is zero. The block condition on G_{ij} guarantees that the linearized boundary value problem is elliptic (no degeneracy in the normal directions), so the smoothing is unique up to Hamiltonian isotopy. If the angles fail to alternate, then all four rays lie in a semicircle of \\Lambda(2) and the Gram matrix drops rank; any attempted rounding forces \\Lambda_1 and \\Lambda_2 to coincide, so \\omega_0 restricts nontrivially somewhere and the vertex cannot be smoothed within the Lagrangian category. Thus the Maslov-angle pattern is exactly the test for the \u201cnontrivial symplectic direct sum\u201d needed in the smoothing argument.", "tags": ["symplectic-geometry", "differential-topology", "manifolds"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "symplectic-geometry", "label": "Maslov angle"}, {"id": "t2", "type": "term", "subtype": "symplectic-geometry", "label": "symplectic Gram matrix"}, {"id": "t3", "type": "term", "subtype": "symplectic-geometry", "label": "Lagrangian Grassmannian"}, {"id": "t4", "type": "term", "subtype": "symplectic-geometry", "label": "vertex star"}, {"id": "t5", "type": "term", "subtype": "symplectic-geometry", "label": "Hamiltonian smoothing"}, {"id": "t6", "type": "term", "subtype": "symplectic-geometry", "label": "Lagrangian angle"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "\\theta_{i+2}\\equiv \\theta_i + \\pi \\pmod{2\\pi}"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "G_{ij}=\\omega_0(w_i,Jw_j)"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "\\det \\begin{pmatrix}0 & D\\\\ -D & 0\\end{pmatrix} = (\\det D)^2"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for any four-face Lagrangian vertex"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if the Maslov angles alternate and the Gram matrix has full rank"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["q1", "t4"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["q1", "e2"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p8-s3-000", "title": "When does the vertex spanning lemma yield a symplectic direct sum?", "question": "Let K\\subset(\\mathbb R^4,\\omega_0) be a polyhedral Lagrangian whose vertex star at p lies in an affine hyperplane H. The algebraic proof of the vertex spanning lemma says that if the four incident edges span H and no two Lagrangian faces coincide, then after reordering a symplectic basis (e_1,e_3,e_2,e_4) we obtain a block-diagonal matrix for \\omega_0, so T_p\\mathbb R^4=V_1\\oplus V_2 with each V_i Lagrangian. What hypotheses on H and on the edges are actually needed to justify this block decomposition? How does ker(\\omega_0|_H) control the topology of the vertex star and guarantee that the algebraic normal form exists?", "answer": "Because K is Lagrangian all faces lie in 2-planes on which \\omega_0 vanishes. If the four edges span the hyperplane H, then \\omega_0|_H is a rank-two skew form whose kernel is one-dimensional. Topologically, this kernel line is the common intersection of all Lagrangian faces: each face contains the line because its tangent plane lies inside H and is isotropic for \\omega_0. If two distinct edges were contained in the kernel, then every edge would be proportional, contradicting the assumption that the star has four distinct faces. Thus there are exactly two opposite edges spanning \\ker(\\omega_0|_H), and the remaining two edges project to a symplectic basis of H/\\ker.\\n\\nChoose a Darboux chart with basis (e_1,e_2,e_3,e_4) such that e_1 lies along \\ker(\\omega_0|_H) and e_2 projects to an edge inside H. Extend by J e_1=e_3 and J e_2=e_4. In this basis the matrix of \\omega_0 takes the form\\n\\n\\Omega=\\begin{pmatrix}0 & 0 & a & 0\\\\0 & 0 & 0 & b\\\\-a & 0 & 0 & 0\\\\0 & -b & 0 & 0\\end{pmatrix},\\n\\nwhere a=\\omega_0(e_1,e_3) and b=\\omega_0(e_2,e_4) are nonzero. The subspaces V_1=\\operatorname{span}\\{e_1,e_3\\} and V_2=\\operatorname{span}\\{e_2,e_4\\} are Lagrangian and complementary, so the vertex star decomposes as a direct sum of two Lagrangian fans. The algebraic block-diagonalization therefore rests on two geometric prerequisites: (1) the edges span a hyperplane H transverse to JH so that \\omega_0|_H has one-dimensional kernel, and (2) the kernel line is contained in every face but coincides with exactly one pair of opposite edges. When these hold the linear algebra argument applies and yields the symplectic direct sum used in the vertex spanning lemma.", "tags": ["symplectic-geometry", "linear-algebra", "differential-geometry"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "symplectic-geometry", "label": "vertex spanning lemma"}, {"id": "t2", "type": "term", "subtype": "symplectic-geometry", "label": "Lagrangian fan"}, {"id": "t3", "type": "term", "subtype": "linear-algebra", "label": "kernel of restricted form"}, {"id": "t4", "type": "term", "subtype": "symplectic-geometry", "label": "Darboux basis"}, {"id": "t5", "type": "term", "subtype": "symplectic-geometry", "label": "symplectic direct sum"}, {"id": "t6", "type": "term", "subtype": "linear-algebra", "label": "block-diagonal form"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "\\ker(\\omega_0|_H) = \\bigcap_{F\\ni p} T_pF"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "\\Omega = \\begin{pmatrix}0 & 0 & a & 0\\\\0 & 0 & 0 & b\\\\-a & 0 & 0 & 0\\\\0 & -b & 0 & 0\\end{pmatrix}"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "T_p\\mathbb R^4 = V_1 \\oplus V_2"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for any four-face Lagrangian vertex"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if the edges span a hyperplane whose \\omega-restriction has one-dimensional kernel"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["q1", "t5"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p8-s3-001", "title": "Geometric criteria for block-diagonalizing \\omega at a vertex", "question": "Suppose a four-valent Lagrangian vertex of K\\subset(\\mathbb R^4,\\omega_0) sits inside an affine hyperplane H. The algebraic vertex spanning lemma block-diagonalizes \\omega_0 once a basis is chosen, but it never spells out the geometric hypotheses on H or on the incident faces. What are the necessary and sufficient conditions on the vertex star that ensure H is coisotropic (\\dim\\ker\\omega_0|_H=1) with kernel lying in each face, and how does one use this to build a symplectic basis (e_1,e_3,e_2,e_4) making \\omega_0 block diagonal?", "answer": "The hyperplane condition alone is not enough: if \\omega_0|_H had two-dimensional kernel, then every tangent direction would be isotropic and the faces would collapse to lines. Thus we require H to be coisotropic, i.e.\\n\\n\\dim H=3,\\qquad \\dim \\ker(\\omega_0|_H)=1.\\n\\nThis happens precisely when the four edges span H and no three lie in a common 2-plane; under that hypothesis the restriction \\omega_0|_H has rank 2 with kernel generated by the unique line contained in every face. Because each face is Lagrangian the kernel line must lie inside it, and if it coincided with more than one edge every edge would be proportional. Hence we get a distinguished pair of opposite edges along \\ker(\\omega_0|_H).\\n\\nPick coordinates so that e_1 points along this kernel line inside H. Choose e_2 in H and transverse to the kernel, for instance along the projection of one of the remaining edges. Set e_3=Je_1 and e_4=Je_2. The matrix of \\omega_0 in this ordered basis is\\n\\n\\Omega=\\begin{pmatrix}0 & 0 & a & 0\\\\0 & 0 & 0 & b\\\\-a & 0 & 0 & 0\\\\0 & -b & 0 & 0\\end{pmatrix},\\quad a,b\\neq0,\\n\\nwhich is block diagonal with blocks corresponding to V_1=\\operatorname{span}\\{e_1,e_3\\} and V_2=\\operatorname{span}\\{e_2,e_4\\}. The kernel line sits inside both V_1 and every face, while the quotient H/\\ker inherits a genuine symplectic form that pairs the other two edges. This explicit construction shows that the topological prerequisites for the algebraic lemma are: (1) the vertex star spans a coisotropic hyperplane, (2) the unique isotropic line in H is contained in exactly one pair of opposite edges, and (3) the remaining edges project to a basis of H/\\ker. When these hold, \\omega_0 admits the desired block form and \\mathbb R^4 splits as V_1\\oplus V_2 with each V_i Lagrangian.", "tags": ["symplectic-geometry", "linear-algebra", "differential-geometry"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "symplectic-geometry", "label": "coisotropic hyperplane"}, {"id": "t2", "type": "term", "subtype": "symplectic-geometry", "label": "vertex star"}, {"id": "t3", "type": "term", "subtype": "symplectic-geometry", "label": "kernel line"}, {"id": "t4", "type": "term", "subtype": "symplectic-geometry", "label": "symplectic basis"}, {"id": "t5", "type": "term", "subtype": "linear-algebra", "label": "block-diagonal form"}, {"id": "t6", "type": "term", "subtype": "symplectic-geometry", "label": "Lagrangian face"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "\\dim\\ker(\\omega_0|_H)=1"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "\\Omega=\\begin{pmatrix}0 & 0 & a & 0\\\\0 & 0 & 0 & b\\\\-a & 0 & 0 & 0\\\\0 & -b & 0 & 0\\end{pmatrix}"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "\\mathbb R^4 = V_1 \\oplus V_2,\\ V_i\\text{ Lagrangian}"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for any four-valent Lagrangian vertex"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if H is coisotropic and the kernel line is unique"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t3"]}, {"type": "mention", "ends": ["q1", "t4"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["q1", "e1"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p8-s5-000", "title": "Extending Hamiltonian edge smoothing to polyhedral Lagrangians", "question": "Lees' and Weinstein's neighborhood theorems are stated for smooth Lagrangian embeddings. Suppose instead we have a polyhedral Lagrangian K\\subset(\\mathbb R^4,\\omega_0) whose edge e is the intersection of two smooth Lagrangian sheets L_1 and L_2 meeting along e with a common tangent line but distinct second-order data (a crease). Under what hypotheses can we still model a neighborhood of e by exact Lagrangian graphs and perform the usual Hamiltonian interpolation S_\\varepsilon=\\chi(x_1/\\varepsilon)S_1+(1-\\chi)S_2 to obtain a smooth edge?", "answer": "The key observation is that the hypotheses of the Lagrangian neighborhood theorem are local and only require a smooth structure along the edge. If each face of the polyhedral Lagrangian is C^1 up to the edge and the two faces share the same tangent line along e, then e admits a tubular neighborhood in which K is the union of two exact Lagrangian graphs. Concretely, pick Darboux coordinates (x_1,x_2,y_1,y_2) with e=\\{x_2=y_1=y_2=0\\} and such that each sheet is the graph of dS_i(x_1,x_2) for i=1,2. The generating functions satisfy S_1=S_2 along x_2=0 and have matching first derivatives because both sheets agree along e; the difference lies in the second fundamental form (the crease).\\n\\nUnder these conditions we can interpolate by the usual cutoff construction\\n\\nS_\\varepsilon(x_1,x_2)=\\chi\\Big(\\frac{x_1}{\\varepsilon}\\Big) S_1(x_1,x_2)+\\big(1-\\chi\\Big(\\frac{x_1}{\\varepsilon}\\Big)\\big) S_2(x_1,x_2),\\n\\nwhere \\chi is a smooth bump function equal to 1 near x_1>0 and 0 near x_1<0. The equality of S_1 and S_2 (and their first derivatives) along x_2=0 ensures that S_\\varepsilon is C^1 and hence defines an exact Lagrangian graph whose boundary matches the unsmoothed vertex neighborhoods. Because the construction is exact, the resulting graph differs from the original union by a compactly supported Hamiltonian isotopy; the Hamiltonian is a primitive of \\partial_t S_t in the usual generating-function proof.\\n\\nThus the local surgery theorem extends to polyhedral Lagrangians provided: (1) each face is smooth up to the edge, (2) the tangent data agree along the edge (so the crease is only second-order), and (3) the faces are exact in a neighborhood of the edge. These assumptions guarantee that Lees'/Weinstein's coordinates still exist and that the bump-function interpolation produces a smooth Lagrangian matching the polyhedral configuration outside the chosen neighborhood.", "tags": ["symplectic-geometry", "differential-topology", "surgery-theory"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "symplectic-geometry", "label": "Lagrangian neighborhood theorem"}, {"id": "t2", "type": "term", "subtype": "symplectic-geometry", "label": "polyhedral Lagrangian"}, {"id": "t3", "type": "term", "subtype": "symplectic-geometry", "label": "Hamiltonian isotopy"}, {"id": "t4", "type": "term", "subtype": "symplectic-geometry", "label": "generating function"}, {"id": "t5", "type": "term", "subtype": "symplectic-geometry", "label": "edge crease"}, {"id": "t6", "type": "term", "subtype": "symplectic-geometry", "label": "exact Lagrangian graph"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "L_i = \\operatorname{graph}(dS_i)"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "S_\\varepsilon(x) = \\chi\\Big(\\frac{x_1}{\\varepsilon}\\Big) S_1(x) + \\big(1-\\chi\\Big(\\frac{x_1}{\\varepsilon}\\Big)\\big) S_2(x)"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "L_{\\varepsilon} = \\operatorname{graph}(dS_\\varepsilon)"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for any two smooth Lagrangian faces sharing an edge"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if the faces agree to first order and are exact near the edge"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t5"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p8-s5-001", "title": "Hamiltonian interpolation along an edge arc", "question": "Two product neighborhoods around consecutive vertices of a polyhedral Lagrangian K\\subset(\\mathbb R^4,\\omega_0) overlap along an edge arc \\gamma. Inside each neighborhood the Lagrangian is the graph of an exact 1-form dS_i over a common 2-disk. Lees/Weinstein give local coordinates in the smooth case, but here \\gamma sits in the piecewise-linear locus. What conditions on \\gamma and on the primitives S_1,S_2 guarantee that the interpolated function S_\\varepsilon(x)=\\chi(x_1/\\varepsilon)S_1+(1-\\chi)S_2 still produces a Hamiltonian smoothing that matches the vertex models at the ends of \\gamma?", "answer": "Assume first that the two vertex neighborhoods have already been smoothed so that near the endpoints of \\gamma the Lagrangian is smooth and coincides with the graphs of dS_1 and dS_2. The edge arc is then contained in the intersection of two Darboux charts in which \\gamma is straight and the sheets are exact graphs. The only obstruction to applying the standard Hamiltonian interpolation is the piecewise-linear transition along \\gamma; to rule it out we require:\\n\\n1. **Exactness along the edge:** the forms \\lambda_{\\omega_0}|_{L_i} admit primitives S_i that extend continuously across \\gamma. This is automatic for polyhedral Lagrangians built from exact faces.\\n2. **C^1 matching on the edge:** S_1 and S_2 agree together with their first derivatives along x_2=0 (the line representing \\gamma) so that their graphs share the same tangent plane. This condition ensures the piecewise-linear crease is only second order.\\n3. **Compact support of the difference:** S_1-S_2 vanishes near the endpoints of \\gamma so that the interpolation leaves the vertex neighborhoods untouched.\\n\\nUnder these hypotheses the cutoff construction\\n\\nS_\\varepsilon(x)=\\chi\\Big(\\frac{x_1}{\\varepsilon}\\Big) S_1(x)+(1-\\chi\\Big(\\frac{x_1}{\\varepsilon}\\Big)) S_2(x)\\n\\ndefines a C^\\infty function equal to S_1 for x_1\\gg0 and to S_2 for x_1\\ll0. Its graph is exact Lagrangian because \\chi depends only on x_1, so dS_\\varepsilon is a convex combination of dS_1 and dS_2 plus a correction supported where \\chi'\\neq0. The family S_t(t\\in[0,1]) connecting S_1 to S_\\varepsilon yields a compactly supported Hamiltonian isotopy supported in the overlap of the vertex neighborhoods. The resulting smoothing matches the vertex data at both ends of \\gamma and replaces the polyhedral crease by a smooth strip. Thus the Lees/Weinstein surgery extends to the PL setting whenever the edge arc admits exact primitives that agree to first order along \\gamma.", "tags": ["symplectic-geometry", "differential-topology", "surgery-theory"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "symplectic-geometry", "label": "polyhedral Lagrangian"}, {"id": "t2", "type": "term", "subtype": "symplectic-geometry", "label": "exact primitive"}, {"id": "t3", "type": "term", "subtype": "symplectic-geometry", "label": "Hamiltonian interpolation"}, {"id": "t4", "type": "term", "subtype": "symplectic-geometry", "label": "vertex neighborhood"}, {"id": "t5", "type": "term", "subtype": "symplectic-geometry", "label": "edge arc"}, {"id": "t6", "type": "term", "subtype": "symplectic-geometry", "label": "Darboux chart"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "S_\\varepsilon(x)=\\chi\\Big(\\frac{x_1}{\\varepsilon}\\Big) S_1(x)+(1-\\chi\\Big(\\frac{x_1}{\\varepsilon}\\Big)) S_2(x)"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "H_t(x) = -\\partial_t S_t(x)"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "L_t = \\operatorname{graph}(dS_t)"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for any edge arc between smoothed vertex neighborhoods"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if S_1,S_2 match to first order along the edge and are exact"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t4"]}, {"type": "mention", "ends": ["q1", "t5"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p8-s6-000", "title": "Patching local Hamiltonian isotopies into a global smoothing", "question": "After smoothing each vertex and edge of a polyhedral Lagrangian via local Hamiltonian isotopies supported in balls B_i and tubular neighborhoods N_j, how can we be sure these local moves glue to a global smoothing of K\\subset(\\mathbb R^4,\\omega_0)? Under what conditions on the supports and on the primitives do the local Hamiltonian flows commute, and how does McDuff\u2013Salamon's composition lemma guarantee that the combined isotopy remains compactly supported and converges to the original K in C^0?", "answer": "Let {B_i} be disjoint Darboux balls around the vertices and {N_j} disjoint tubular neighborhoods of the edge segments between them. By construction the vertex and edge isotopies are exact and supported inside these sets, so their Hamiltonians H_i(t,\\cdot) and G_j(t,\\cdot) vanish outside B_i and N_j respectively. Because the supports are disjoint, the associated flows commute (McDuff\u2013Salamon Prop. 3.17): if \\phi_t^i and \\psi_t^j are the local isotopies, then \\phi_t^i\\psi_t^j=\\psi_t^j\\phi_t^i, and the product flow is generated by the Hamiltonian sum\\n\\nH_t(x)=\\sum_i H_i(t,x)+\\sum_j G_j(t,x).\\n\\nWe also require that the local surgeries match along the boundaries of the neighborhoods. This is achieved by choosing the vertex smoothing so that \\partial B_i\\cap K is a flat annulus, and by arranging the edge interpolations to agree with the vertex models on \\partial N_j. Consequently the total isotopy is the identity on \\partial B_i and \\partial N_j, so the patched map is smooth across the overlaps.\\n\\nWith these hypotheses the global isotopy \\Phi_t, obtained by composing the finitely many commuting local flows, is compactly supported in \\bigcup_i B_i\\cup\\bigcup_j N_j. Moreover, \\Phi_t(K) converges to K in the C^0 topology as t\\to0 because each local isotopy does, and outside the supports \\Phi_t is the identity. This recovers a smooth Lagrangian K_1 that coincides with the original polyhedral K outside the chosen neighborhoods and differs from K by a Hamiltonian isotopy, completing the global patching step.", "tags": ["symplectic-geometry", "differential-topology", "manifolds"], "nodes": [{"id": "q1", "type": "post", "subtype": "question"}, {"id": "a1", "type": "post", "subtype": "answer"}, {"id": "t1", "type": "term", "subtype": "symplectic-geometry", "label": "Hamiltonian isotopy"}, {"id": "t2", "type": "term", "subtype": "symplectic-geometry", "label": "support"}, {"id": "t3", "type": "term", "subtype": "symplectic-geometry", "label": "Weinstein neighborhood"}, {"id": "t4", "type": "term", "subtype": "symplectic-geometry", "label": "vertex smoothing"}, {"id": "t5", "type": "term", "subtype": "symplectic-geometry", "label": "edge interpolation"}, {"id": "t6", "type": "term", "subtype": "symplectic-geometry", "label": "McDuff\u2013Salamon composition"}, {"id": "e1", "type": "expression", "subtype": "latex", "latex": "H_t = \\sum_i H_i(t,x) + \\sum_j G_j(t,x)"}, {"id": "e2", "type": "expression", "subtype": "latex", "latex": "\\Phi_t = \\prod_i \\phi_t^i \\prod_j \\psi_t^j"}, {"id": "e3", "type": "expression", "subtype": "latex", "latex": "\\Phi_t(K) \\to K \\text{ in } C^0"}, {"id": "s1", "type": "scope", "subtype": "quant/universal", "text": "for any finite collection of disjoint local surgeries"}, {"id": "s2", "type": "scope", "subtype": "conditional", "text": "if the supports are disjoint and the models agree on neighborhood boundaries"}], "edges": [{"type": "mention", "ends": ["q1", "t1"]}, {"type": "mention", "ends": ["q1", "t2"]}, {"type": "mention", "ends": ["q1", "t4"]}, {"type": "mention", "ends": ["a1", "t1"]}, {"type": "mention", "ends": ["a1", "t2"]}, {"type": "mention", "ends": ["a1", "t3"]}, {"type": "mention", "ends": ["a1", "t4"]}, {"type": "mention", "ends": ["a1", "t5"]}, {"type": "mention", "ends": ["a1", "t6"]}, {"type": "surface", "ends": ["a1", "e1"]}, {"type": "surface", "ends": ["a1", "e2"]}, {"type": "surface", "ends": ["a1", "e3"]}, {"type": "scope", "ends": ["q1", "s1"]}, {"type": "scope", "ends": ["a1", "s1"]}, {"type": "scope", "ends": ["q1", "s2"]}, {"type": "scope", "ends": ["a1", "s2"]}, {"type": "discourse", "ends": ["q1", "a1"]}, {"type": "iatc", "ends": ["q1", "a1"], "attrs": {"performative": "query"}}, {"type": "iatc", "ends": ["a1", "q1"], "attrs": {"performative": "assert"}}]}, {"thread_id": "synth-p8-s6-001", "title": "Obstructions and remedies for global Hamiltonian patching", "question": "In smoothing a polyhedral Lagrangian K\\subset(\\mathbb R^4,\\omega_0), each vertex and edge is handled by a local Hamiltonian isotopy with compact support. What are the potential obstructions to patching these local moves into a global isotopy, and how can one use partitions of unity or flux considerations to ensure the final map is Hamiltonian and agrees with K outside the chosen neighborhoods?", "answer": "The only possible obstructions come from overlapping supports or from nontrivial flux. If two local isotopies overlap, their Hamiltonians may fail to commute and the resulting flow may not equal the intended composition; if the local primitives do not glue to a global primitive, the concatenated isotopy may only be symplectic rather than Hamiltonian. Both issues are avoided by the standard setup:\\n\\n1. Choose disjoint Darboux neighborhoods around vertices and disjoint tubular neighborhoods of edge segments. Use a partition of unity subordinate to these sets when writing the global Hamiltonian \\tilde H_t=\\sum \\rho_i H_i(t,x); the cutoffs ensure that \\tilde H_t agrees with H_i inside the i-th neighborhood and vanishes elsewhere.\\n\\n2. Arrange that each local isotopy is exact: the faces are exact Lagrangians, so \\lambda_{\\omega_0}|_{L}\\) has primitives agreeing on the overlaps; the flux of each isotopy therefore vanishes. The sum \\tilde H_t then has zero fl <script>
const DATA = JSON.parse(document.getElementById('arse-data').textContent);

const PROBLEM_LABELS = {
  p2: 'Problem 2 \u2014 Number Theory (Conductor Exponents)',
  p3: 'Problem 3 \u2014 Combinatorics (Macdonald Polynomials & Markov Chains)',
  p7: 'Problem 7 \u2014 Algebraic Topology (Torsion Lattices & Manifolds)',
  p8: 'Problem 8 \u2014 Symplectic Geometry (Polyhedral Lagrangians)'
};

function groupByProblem(data) {
  const groups = {};
  data.forEach(d => {
    const pid = d.thread_id.split('-')[1];
    if (!groups[pid]) groups[pid] = [];
    groups[pid].push(d);
  });
  return groups;
}

function getAllTags(data) {
  const tags = new Set();
  data.forEach(d => (d.tags || []).forEach(t => tags.add(t)));
  return [...tags].sort();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderDashboard() {
  const groups = groupByProblem(DATA);
  const totalQA = DATA.length;
  const totalNodes = DATA.reduce((s, d) => s + (d.nodes || []).length, 0);
  const totalEdges = DATA.reduce((s, d) => s + (d.edges || []).length, 0);
  const allTags = getAllTags(DATA);

  document.getElementById('header-stats').textContent =
    totalQA + ' QA pairs | ' + Object.keys(groups).length + ' problems | ' + allTags.length + ' tags';

  document.getElementById('totals').innerHTML =
    '<div class="total-card"><div class="num">' + totalQA + '</div><div class="label">QA Pairs</div></div>' +
    '<div class="total-card"><div class="num">' + Object.keys(groups).length + '</div><div class="label">Problems</div></div>' +
    '<div class="total-card"><div class="num">' + totalNodes + '</div><div class="label">Total Nodes</div></div>' +
    '<div class="total-card"><div class="num">' + totalEdges + '</div><div class="label">Total Edges</div></div>' +
    '<div class="total-card"><div class="num">' + allTags.length + '</div><div class="label">Distinct Tags</div></div>';

  var html = '';
  var sortedPids = Object.keys(groups).sort();
  sortedPids.forEach(function(pid) {
    var items = groups[pid];
    var label = PROBLEM_LABELS[pid] || ('Problem ' + pid);
    html += '<div class="problem-group">';
    html += '<h2>' + label + ' <span class="count">(' + items.length + ' QA pairs)</span></h2>';
    html += '<div class="qa-grid">';
    items.forEach(function(d) {
      var terms = (d.nodes || []).filter(function(n){ return n.type === 'term'; }).length;
      var exprs = (d.nodes || []).filter(function(n){ return n.type === 'expression'; }).length;
      var scopes = (d.nodes || []).filter(function(n){ return n.type === 'scope'; }).length;
      var edges = (d.edges || []).length;
      html += '<div class="qa-card" onclick="showDetail(\'' + d.thread_id + '\')">' +
        '<div class="card-title">' + escapeHtml(d.title) + '</div>' +
        '<div class="card-meta"><span>' + edges + ' edges</span>' +
        '<div class="node-summary">' +
        '<span class="ns ns-term">' + terms + ' terms</span>' +
        '<span class="ns ns-expr">' + exprs + ' expr</span>' +
        '<span class="ns ns-scope">' + scopes + ' scope</span>' +
        '</div></div>' +
        '<div class="card-tags">' + (d.tags || []).map(function(t){ return '<span class="tag">' + t + '</span>'; }).join('') + '</div>' +
        '</div>';
    });
    html += '</div></div>';
  });
  document.getElementById('problem-list').innerHTML = html;
}

function showDashboard() {
  document.getElementById('dashboard').style.display = '';
  document.getElementById('detail').style.display = 'none';
  window.scrollTo(0, 0);
}

function getNodeLabel(d, nodeId) {
  var node = (d.nodes || []).find(function(n){ return n.id === nodeId; });
  if (!node) return nodeId;
  if (node.label) return nodeId + ': ' + node.label;
  if (node.text) return nodeId + ': ' + node.text.substring(0, 40);
  if (node.subtype) return nodeId + ' (' + node.subtype + ')';
  return nodeId;
}

function formatMath(text) {
  if (!text) return '';
  var out = escapeHtml(text);
  // Split on \n\n for paragraphs, \n for line breaks
  var paragraphs = out.split('\\n\\n');
  return paragraphs.map(function(p) {
    return '<p>' + p.replace(/\\n/g, '<br>') + '</p>';
  }).join('');
}

function showDetail(threadId) {
  var d = DATA.find(function(x){ return x.thread_id === threadId; });
  if (!d) return;

  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('detail').style.display = '';

  var terms = (d.nodes || []).filter(function(n){ return n.type === 'term'; });
  var exprs = (d.nodes || []).filter(function(n){ return n.type === 'expression'; });
  var scopes = (d.nodes || []).filter(function(n){ return n.type === 'scope'; });
  var posts = (d.nodes || []).filter(function(n){ return n.type === 'post'; });

  var html = '<div class="detail-header">' +
    '<h2>' + escapeHtml(d.title) + '</h2>' +
    '<div class="detail-meta">' + d.thread_id + ' &nbsp;|&nbsp; ' +
    (d.tags || []).map(function(t){ return '<span class="tag" style="display:inline">' + t + '</span>'; }).join(' ') +
    ' &nbsp;|&nbsp; ' + (d.nodes||[]).length + ' nodes, ' + (d.edges||[]).length + ' edges</div></div>';

  html += '<div class="qa-section"><h3>Question</h3><div class="content">' + formatMath(d.question) + '</div></div>';
  html += '<div class="qa-section answer"><h3>Answer</h3><div class="content">' + formatMath(d.answer) + '</div></div>';

  // Expressions
  if (exprs.length > 0) {
    html += '<div class="expr-panel"><h3>Expressions (' + exprs.length + ')</h3>';
    exprs.forEach(function(e) {
      html += '<div class="expr-item">\\(' + escapeHtml(e.latex) + '\\)</div>';
    });
    html += '</div>';
  }

  // Nodes
  html += '<div class="graph-panel"><h3>Hypergraph Nodes (' + (d.nodes||[]).length + ')</h3><div class="node-list">';
  posts.forEach(function(n) {
    html += '<span class="node-chip chip-post"><span class="ntype">post</span> ' + (n.subtype || n.id) + '</span>';
  });
  terms.forEach(function(n) {
    html += '<span class="node-chip chip-term"><span class="ntype">' + (n.subtype||'term') + '</span> ' + escapeHtml(n.label || n.id) + '</span>';
  });
  scopes.forEach(function(n) {
    html += '<span class="node-chip chip-scope"><span class="ntype">' + (n.subtype||'scope') + '</span> ' + escapeHtml(n.text || n.id) + '</span>';
  });
  html += '</div>';

  // Edges
  html += '<h3 style="margin-top:16px;">Edges (' + (d.edges||[]).length + ')</h3>';
  html += '<table class="edge-table"><thead><tr><th>Type</th><th>From</th><th>To</th><th>Attrs</th></tr></thead><tbody>';
  (d.edges || []).forEach(function(e) {
    var cls = 'et-' + e.type;
    var attrs = e.attrs ? JSON.stringify(e.attrs) : '';
    html += '<tr><td><span class="edge-type ' + cls + '">' + e.type + '</span></td>' +
      '<td>' + escapeHtml(getNodeLabel(d, e.ends[0])) + '</td>' +
      '<td>' + escapeHtml(getNodeLabel(d, e.ends[1])) + '</td>' +
      '<td style="color:var(--fg2);font-size:0.85em">' + escapeHtml(attrs) + '</td></tr>';
  });
  html += '</tbody></table></div>';

  document.getElementById('detail-content').innerHTML = html;
  window.scrollTo(0, 0);

  if (window.MathJax && window.MathJax.typesetPromise) {
    MathJax.typesetPromise([document.getElementById('detail-content')]);
  }
}

renderDashboard();
</script>
</body>
</html>
